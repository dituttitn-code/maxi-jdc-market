<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi des Commandes - MAXI JDC MARKET</title>
    <style>
        :root { --primary: #0a1929; --secondary: #00ff88; --accent: #00d4ff; --light: #f0f6fc; --dark: #1a365d; }
        body { background: linear-gradient(135deg, var(--primary) 0%, #112240 100%); color: var(--light); min-height: 100vh; margin: 0; padding: 20px; }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            flex-wrap: wrap; 
            background: rgba(10, 25, 47, 0.9);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--secondary);
        }
        
        h1 { 
            color: var(--secondary); 
            margin: 0;
            font-size: 24px;
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid;
            background: rgba(255,255,255,0.1);
            color: var(--light);
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .nav-btn.home {
            border-color: var(--secondary);
            background: rgba(0, 255, 136, 0.1);
        }
        
        .nav-btn.dashboard {
            border-color: var(--accent);
            background: rgba(0, 212, 255, 0.1);
        }
        
        .filtres { 
            background: var(--dark); 
            padding: 20px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            display: flex; 
            gap: 15px; 
            flex-wrap: wrap; 
            border: 1px solid var(--accent);
        }
        
        .filtres input, .filtres select, .filtres button { 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--accent); 
            background: rgba(255,255,255,0.1); 
            color: white; 
            font-size: 14px;
            min-width: 150px;
        }
        
        .filtres button { 
            background: var(--secondary); 
            color: var(--primary); 
            font-weight: bold; 
            cursor: pointer; 
            border: none; 
            transition: all 0.3s;
        }
        
        .filtres button:hover {
            background: #00e676;
            transform: translateY(-2px);
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: var(--dark); 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 20px;
        }
        
        th, td { 
            padding: 15px; 
            text-align: left; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
        }
        
        th { 
            background: rgba(0, 255, 136, 0.1); 
            color: var(--secondary); 
            font-weight: 900;
            font-size: 14px;
        }
        
        tr:hover { 
            background: rgba(255,255,255,0.05); 
        }
        
        .statut { 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: bold; 
            text-align: center;
            display: inline-block;
            min-width: 100px;
        }
        
        .statut-en-attente { 
            background: rgba(255, 193, 7, 0.2); 
            color: #FFC107; 
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        
        .statut-en-cours { 
            background: rgba(33, 150, 243, 0.2); 
            color: #2196F3; 
            border: 1px solid rgba(33, 150, 243, 0.3);
        }
        
        .statut-livree { 
            background: rgba(76, 175, 80, 0.2); 
            color: #4CAF50; 
            border: 1px solid rgba(76, 175, 80, 0.3);
        }
        
        .statut-annulee { 
            background: rgba(244, 67, 54, 0.2); 
            color: #F44336; 
            border: 1px solid rgba(244, 67, 54, 0.3);
        }
        
        .btn-action { 
            padding: 8px 12px; 
            margin: 0 3px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn-edit { 
            background: var(--accent); 
            color: white; 
        }
        
        .btn-edit:hover {
            background: #00b8d4;
        }
        
        .btn-delete { 
            background: #ff6b6b; 
            color: white; 
        }
        
        .btn-delete:hover {
            background: #ff5252;
        }
        
        .empty { 
            text-align: center; 
            padding: 50px; 
            color: #ccc; 
            font-size: 16px;
        }
        
        .articles-cell {
            max-width: 200px;
            white-space: pre-line;
            font-size: 12px;
            line-height: 1.3;
        }
        
        @media (max-width: 768px) {
            .filtres {
                flex-direction: column;
            }
            
            .filtres input, .filtres select, .filtres button {
                width: 100%;
            }
            
            table {
                display: block;
                overflow-x: auto;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .nav-buttons {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 Suivi Détaillé des Commandes</h1>
        <div class="nav-buttons">
            <a href="index.html" class="nav-btn home">
                🏠 Accueil
            </a>
            <a href="tdb.html" class="nav-btn dashboard">
                📊 Tableau de Bord
            </a>
        </div>
    </div>

    <div class="filtres">
        <select id="filterStatut" onchange="loadCommandes()">
            <option value="all">Tous les statuts</option>
            <option value="En attente">En attente</option>
            <option value="En cours">En cours</option>
            <option value="Livrée">Livrée</option>
            <option value="Annulée">Annulée</option>
        </select>
        <input type="text" id="filterSearch" placeholder="Rechercher client, téléphone ou n° commande..." oninput="loadCommandes()">
        <input type="date" id="filterDate" onchange="loadCommandes()">
        <button onclick="exporterCSV()">📥 Exporter CSV</button>
        <button onclick="loadCommandes()">🔄 Actualiser</button>
    </div>

    <div id="commandesContainer">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Client</th>
                    <th>Téléphone</th>
                    <th>Adresse</th>
                    <th>N° Commande</th>
                    <th>Articles</th>
                    <th>Total</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="commandesBody">
                <!-- Rempli dynamiquement -->
            </tbody>
        </table>
    </div>

    <div id="emptyState" class="empty" style="display: none;">
        <h3>Aucune commande trouvée</h3>
        <p>Les commandes apparaîtront ici lorsqu'elles seront passées.</p>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxvCaw20Esx8UMTP2ENSGnnjDI4ltyitaqp59jXy8ULsmMjjq4xKnPt8bNe0p5bkBAl/exec";
        
        let allCommandes = [];
        
        async function loadCommandes() {
            try {
                showLoading();
                
                const response = await fetch(`${API_URL}?method=getAllOrders&t=${Date.now()}`);
                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || "Erreur lors de la récupération des commandes");
                }
                
                allCommandes = data.orders || [];
                
                displayCommandes(allCommandes);
                
            } catch (error) {
                console.error("Erreur loadCommandes:", error);
                document.getElementById('commandesBody').innerHTML = `
                    <tr>
                        <td colspan="9" style="text-align:center; padding:30px; color:#ff6b6b">
                            ❌ Erreur de chargement: ${error.message}
                        </td>
                    </tr>
                `;
            }
        }
        
        function displayCommandes(commandes) {
            const filterStatut = document.getElementById('filterStatut').value;
            const search = document.getElementById('filterSearch').value.toLowerCase();
            const filterDate = document.getElementById('filterDate').value;
            
            const filtered = commandes.filter(cmd => {
                // Filtre par statut
                if (filterStatut !== 'all' && cmd.statut !== filterStatut) return false;
                
                // Filtre par recherche
                if (search) {
                    const searchText = `
                        ${cmd.nom || ''}
                        ${cmd.telephone || ''}
                        ${cmd.commande_id || ''}
                        ${cmd.adresse || ''}
                    `.toLowerCase();
                    
                    if (!searchText.includes(search)) return false;
                }
                
                // Filtre par date
                if (filterDate && cmd.date && !cmd.date.startsWith(filterDate)) return false;
                
                return true;
            }).sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
            
            const tbody = document.getElementById('commandesBody');
            const empty = document.getElementById('emptyState');
            const container = document.getElementById('commandesContainer');
            
            if (filtered.length === 0) {
                container.style.display = 'none';
                empty.style.display = 'block';
                return;
            }
            
            container.style.display = 'block';
            empty.style.display = 'none';
            
            tbody.innerHTML = filtered.map(cmd => {
                const statutClass = `statut-${cmd.statut ? cmd.statut.toLowerCase().replace(' ', '-') : 'en-attente'}`;
                const articlesText = cmd.articles ? cmd.articles.replace(/\n/g, '<br>') : '';
                
                return `
                    <tr>
                        <td>${formatDate(cmd.date)}</td>
                        <td><strong>${escapeHtml(cmd.nom || '')}</strong></td>
                        <td>${escapeHtml(cmd.telephone || '')}</td>
                        <td>${escapeHtml(cmd.adresse || '')}</td>
                        <td><strong>${escapeHtml(cmd.commande_id || '')}</strong></td>
                        <td class="articles-cell">${articlesText}</td>
                        <td><strong>${formatPrice(cmd.total)}</strong></td>
                        <td>
                            <span class="statut ${statutClass}">
                                ${cmd.statut || 'En attente'}
                            </span>
                        </td>
                        <td>
                            <button class="btn-action btn-edit" onclick="changerStatut('${escapeHtml(cmd.commande_id || '')}')">
                                🔄 Changer statut
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        function showLoading() {
            document.getElementById('commandesBody').innerHTML = `
                <tr>
                    <td colspan="9" style="text-align:center; padding:30px;">
                        <div style="display:inline-block; padding:20px; background:rgba(255,255,255,0.05); border-radius:10px;">
                            <div style="font-size:24px; margin-bottom:10px;">⏳</div>
                            <div>Chargement des commandes...</div>
                        </div>
                    </td>
                </tr>
            `;
        }
        
        async function changerStatut(commandeId) {
            const nouveauStatut = prompt(`Changer le statut de la commande ${commandeId} :\n\n1. En attente\n2. En cours\n3. Livrée\n4. Annulée\n\nEntrez le nouveau statut:`);
            
            if (!nouveauStatut) return;
            
            if (!['En attente', 'En cours', 'Livrée', 'Annulée'].includes(nouveauStatut)) {
                alert('Statut invalide. Veuillez choisir parmi: En attente, En cours, Livrée, Annulée');
                return;
            }
            
            try {
                const response = await fetch(
                    `${API_URL}?method=updateOrderStatus&commande_id=${encodeURIComponent(commandeId)}&statut=${encodeURIComponent(nouveauStatut)}&t=${Date.now()}`
                );
                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || "Erreur lors de la mise à jour");
                }
                
                alert(`✅ Statut de la commande ${commandeId} mis à jour: ${nouveauStatut}`);
                loadCommandes();
                
            } catch (error) {
                console.error("Erreur changement statut:", error);
                alert(`❌ Erreur: ${error.message}`);
            }
        }
        
        function exporterCSV() {
            if (allCommandes.length === 0) {
                alert("Aucune donnée à exporter.");
                return;
            }
            
            let csv = "Date;Client;Téléphone;Adresse;N° Commande;Articles;Total;Statut\n";
            
            allCommandes.forEach(cmd => {
                const articles = cmd.articles ? cmd.articles.replace(/;/g, ',').replace(/\n/g, ' | ') : '';
                csv += `"${formatDate(cmd.date)}";"${cmd.nom || ''}";"${cmd.telephone || ''}";"${cmd.adresse || ''}";"${cmd.commande_id || ''}";"${articles}";${cmd.total || '0'};"${cmd.statut || 'En attente'}"\n`;
            });
            
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `commandes-maxi-jdc-${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            
            alert(`✅ ${allCommandes.length} commande(s) exportées en CSV`);
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return '';
            try {
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) return dateStr;
                return date.toLocaleDateString('fr-FR', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return dateStr;
            }
        }
        
        function formatPrice(amount) {
            const n = Number(amount || 0);
            return n.toFixed(2).replace('.', ',') + ' dt';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Actualiser automatiquement toutes les 30 secondes
        window.onload = function() {
            loadCommandes();
            setInterval(loadCommandes, 30000);
        };
    </script>
</body>
</html>
