<script>
  /* ===================== CONFIG ===================== */
  // ✅ Mets ici TON URL /exec (la bonne)
  const API_URL = "https://script.google.com/macros/s/AKfycbz9x8ZWTQOC1g6b5uTNImzR0xakWldSarkABsaK9xxIdSHjN4HB59lB7swoie1Gkf5g/exec";

  const state = {
    stats: {
      chiffreAffaires: 0,
      commandes: 0,
      panierMoyen: 0,
      topProduit: null,
      categories: [],   // [{name, qty}]
    },
    lastOrders: [],     // [{date, nom, telephone, adresse, total, statut}]
    charts: { sales: null, category: null }
  };

  /* ===================== UI helpers ===================== */
  const $ = (id) => document.getElementById(id);

  function showToast(msg, type = "info") {
    const el = $("toast");
    const bg = type === "success" ? "#00ff88" : type === "error" ? "#ff6b6b" : "#00d4ff";
    el.style.background = bg;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.classList.remove("show"), 2600);
  }

  function formatPrice(amount) {
    const n = Number(amount || 0);
    return n.toFixed(2).replace(".", ",") + " dt";
  }

  function safeText(x) {
    if (x === null || x === undefined) return "";
    return String(x);
  }

  function formatDate(dateValue) {
    const d = new Date(dateValue);
    if (isNaN(d.getTime())) return safeText(dateValue);
    return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  /* ===================== API calls (NO JSONP) ===================== */
  async function apiGet(path) {
    // t=Date.now() évite cache et aide en debug
    const url = API_URL + path + (path.includes("?") ? "&" : "?") + "t=" + Date.now();
    const res = await fetch(url); // <-- IMPORTANT: pas de headers ici
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data || data.ok !== true) throw new Error(data?.error || "Réponse API invalide");
    return data;
  }

  async function loadStats() {
    const data = await apiGet("?action=stats");

    state.stats.chiffreAffaires = Number(data.chiffreAffaires || 0);
    state.stats.commandes = Number(data.commandes || 0);
    state.stats.panierMoyen = Number(data.panierMoyen || 0);
    state.stats.topProduit = data.topProduit || null;
    state.stats.categories = Array.isArray(data.categories) ? data.categories : [];

    $("lastUpdate").textContent = new Date().toLocaleString("fr-FR");
  }

  async function loadLastOrders(limit = 10) {
    const data = await apiGet("?action=orders&limit=" + encodeURIComponent(limit));
    state.lastOrders = Array.isArray(data.lastOrders) ? data.lastOrders : [];
  }

  /* ===================== UI render ===================== */
  function updateCards() {
    $("totalRevenue").textContent = formatPrice(state.stats.chiffreAffaires);
    $("totalOrders").textContent = String(state.stats.commandes);
    $("avgOrderValue").textContent = formatPrice(state.stats.panierMoyen);

    const tp = state.stats.topProduit;
    $("topProductName").textContent = tp && tp.name ? `${tp.name} (${tp.qty || 0})` : "—";
  }

  function updateRecentOrdersTable() {
    const body = $("recentOrdersBody");
    body.innerHTML = "";

    for (const o of (state.lastOrders || [])) {
      const tr = document.createElement("tr");
      const status = safeText(o.statut || o.status || "—");
      const statusColor = status.toLowerCase().includes("liv") ? "var(--green)" : "var(--orange)";
      tr.innerHTML = `
        <td>${formatDate(o.date)}</td>
        <td>
          <div style="font-weight:900">${safeText(o.nom || o.clientName || "")}</div>
          <div style="font-size:12px;color:var(--muted)">${safeText(o.telephone || o.clientPhone || "")}</div>
        </td>
        <td style="font-weight:900;color:var(--green)">${formatPrice(o.total)}</td>
        <td><span style="font-weight:1000;color:${statusColor}">${status}</span></td>
      `;
      body.appendChild(tr);
    }

    if (!body.children.length) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="4" style="color:var(--muted)">Aucune commande.</td>`;
      body.appendChild(tr);
    }
  }

  // ⚠️ Ton API ne renvoie pas la liste complète des top produits (seulement topProduit).
  // Donc on remplit le tableau "Top produits" avec une seule ligne (topProduit).
  function updateTopProductsTable() {
    const body = $("topProductsBody");
    body.innerHTML = "";

    const tp = state.stats.topProduit;
    if (tp && tp.name) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><div style="font-weight:900">${safeText(tp.name)}</div></td>
        <td style="font-weight:900">${Number(tp.qty || 0)}</td>
        <td style="font-weight:900;color:var(--muted)">—</td>
      `;
      body.appendChild(tr);
      return;
    }

    const tr = document.createElement("tr");
    tr.innerHTML = `<td colspan="3" style="color:var(--muted)">Aucune donnée.</td>`;
    body.appendChild(tr);
  }

  /* ===================== Charts ===================== */
  function initCharts() {
    const salesCtx = $("salesChart").getContext("2d");
    state.charts.sales = new Chart(salesCtx, {
      type: "line",
      data: { labels: [], datasets: [{ label: "Chiffre d'affaires (dt)", data: [], borderWidth: 3, fill: true, tension: .35 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: "#f0f6fc" } } },
        scales: {
          x: { ticks: { color: "#8b949e" }, grid: { color: "rgba(255,255,255,.10)" } },
          y: { ticks: { color: "#8b949e" }, grid: { color: "rgba(255,255,255,.10)" } }
        }
      }
    });

    const catCtx = $("categoryChart").getContext("2d");
    state.charts.category = new Chart(catCtx, {
      type: "doughnut",
      data: { labels: [], datasets: [{ data: [], borderWidth: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: "right", labels: { color: "#f0f6fc" } } }
      }
    });
  }

  function updateCategoryChart() {
    const cats = (state.stats.categories || []).slice(0, 8);
    if (!state.charts.category) return;

    state.charts.category.data.labels = cats.map(c => c.name);
    state.charts.category.data.datasets[0].data = cats.map(c => Number(c.qty || 0));
    state.charts.category.update();
  }

  // Graphe ventes: on calcule à partir des dernières commandes (limité).
  // (Si tu veux un graphe parfait 30/90 jours, il faudra un endpoint API qui renvoie l’historique complet.)
  function updateSalesChartFromOrders() {
    const period = Number($("salesPeriod").value || 30);
    const map = new Map(); // key dd/mm/yyyy -> total

    for (const o of (state.lastOrders || [])) {
      const d = new Date(o.date);
      const key = isNaN(d.getTime()) ? safeText(o.date) : d.toLocaleDateString("fr-FR");
      map.set(key, (map.get(key) || 0) + Number(o.total || 0));
    }

    const labels = [];
    const values = [];
    for (let i = period - 1; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = d.toLocaleDateString("fr-FR");
      labels.push(key);
      values.push(Number(map.get(key) || 0));
    }

    if (state.charts.sales) {
      state.charts.sales.data.labels = labels;
      state.charts.sales.data.datasets[0].data = values;
      state.charts.sales.update();
    }
  }

  /* ===================== Main ===================== */
  async function refreshAll() {
    try {
      $("btnRefresh").disabled = true;

      // 1) Stats
      await loadStats();

      // 2) Dernières commandes (10)
      await loadLastOrders(10);

      // 3) UI
      updateCards();
      updateTopProductsTable();
      updateRecentOrdersTable();

      // 4) Charts
      updateCategoryChart();

      // Si tu veux que le graphe ventes soit basé sur + de commandes :
      // remplace 10 par 50 dans loadLastOrders() ci-dessus.
      updateSalesChartFromOrders();

      showToast("✅ Données chargées depuis l'API", "success");
    } catch (e) {
      console.error(e);
      showToast("❌ Erreur de connexion API", "error");
    } finally {
      $("btnRefresh").disabled = false;
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    initCharts();

    $("salesPeriod").addEventListener("change", () => updateSalesChartFromOrders());
    $("btnRefresh").addEventListener("click", () => refreshAll());

    refreshAll();
    setInterval(refreshAll, 30000);
  });
</script>
