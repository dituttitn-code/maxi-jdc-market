<script type="module">
    /* ===================== CONFIG API ===================== */
    // URL de votre API Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbz3Vj3vkSiRjI2kZBeFADINIbmykhmVkmXaRc09McI8Q9TAlnQs_THgzrJvjoslF-qY/exec";

    const state = {
      orders: [],
      analytics: {
        totalRevenue: 0,
        totalOrders: 0,
        avgOrderValue: 0,
        topProducts: [],
        statusDistribution: {},
        salesByDay: {}
      },
      charts: {
        sales: null,
        status: null
      }
    };

    /* ===================== UI helpers ===================== */
    const $ = (id) => document.getElementById(id);

    function showToast(msg, type = "info") {
      const el = $("toast");
      const bg = type === "success" ? "#00ff88" : type === "error" ? "#ff6b6b" : "#00d4ff";
      el.style.background = bg;
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function formatPrice(amount) {
      const n = Number(amount || 0);
      return n.toFixed(2).replace(".", ",") + " dt";
    }

    function safeText(x) {
      if (x === null || x === undefined) return "";
      return String(x);
    }

    function formatDate(dateStr) {
      if (!dateStr) return "";
      try {
        const date = new Date(dateStr);
        if (isNaN(date.getTime())) return dateStr;
        return date.toLocaleDateString("fr-FR", { 
          year: "numeric", 
          month: "2-digit", 
          day: "2-digit" 
        });
      } catch {
        return dateStr;
      }
    }

    /* ===================== LOAD ORDERS FROM API ===================== */
    async function loadOrders() {
      try {
        const response = await fetch(`${API_URL}?method=getAllOrders&t=${Date.now()}`);
        
        if (!response.ok) {
          throw new Error(`Erreur HTTP: ${response.status}`);
        }
        
        const data = await response.json();
        
        if (!data.success) {
          throw new Error(data.error || "Erreur lors de la récupération des commandes");
        }
        
        // Convertir les données API au format interne
        state.orders = (data.orders || []).map(order => ({
          id: order.id,
          Date: order.date || "",
          Nom: order.nom || "",
          Téléphone: order.telephone || "",
          Adresse: order.adresse || "",
          Commande: order.commande_id || "",
          Articles: order.articles || "",
          Total: order.total || "0",
          Statut: order.statut || "En attente"
        }));
        
        $("lastUpdate").textContent = new Date().toLocaleString("fr-FR");
        return state.orders;
        
      } catch (error) {
        console.error("Erreur loadOrders:", error);
        showToast("❌ Erreur de connexion à l'API", "error");
        return [];
      }
    }

    /* ===================== ANALYTICS ===================== */
    function parseArticles(articlesText) {
      if (!articlesText) return [];
      
      try {
        // Si c'est du JSON
        if (articlesText.trim().startsWith("[")) {
          return JSON.parse(articlesText);
        }
        
        // Sinon, parser le format "3x Produit\n5x Autre"
        const articles = [];
        const lines = articlesText.split('\n');
        
        for (const line of lines) {
          const match = line.trim().match(/^(\d+)x\s+(.+)$/);
          if (match) {
            const quantite = parseInt(match[1]);
            const produit = match[2].trim();
            
            // Chercher un prix dans le produit
            let prix = 0;
            const priceMatch = produit.match(/\(([\d.,]+)\s*dt\)$/);
            if (priceMatch) {
              prix = parseFloat(priceMatch[1].replace(',', '.'));
            }
            
            articles.push({
              produit: produit.replace(/\s*\([\d.,]+\s*dt\)$/, ''),
              quantite: quantite,
              prix_unitaire: prix,
              prix_total: prix * quantite
            });
          }
        }
        
        return articles;
      } catch (error) {
        console.error("Erreur parseArticles:", error);
        return [];
      }
    }

    function calculateAnalytics() {
      const orders = state.orders || [];

      // Calcul des statistiques de base
      const totalRevenue = orders.reduce((sum, order) => {
        const total = parseFloat(order.Total) || 0;
        return sum + total;
      }, 0);
      
      const totalOrders = orders.length;
      const avgOrderValue = totalOrders > 0 ? totalRevenue / totalOrders : 0;

      // Distribution des statuts
      const statusDistribution = {};
      orders.forEach(order => {
        const statut = order.Statut || "En attente";
        statusDistribution[statut] = (statusDistribution[statut] || 0) + 1;
      });

      // Analyse des produits
      const productSales = new Map();
      orders.forEach(order => {
        const articles = parseArticles(order.Articles);
        articles.forEach(article => {
          const productName = article.produit || "Produit";
          const quantite = article.quantite || 0;
          const revenu = article.prix_total || 0;
          
          if (!productSales.has(productName)) {
            productSales.set(productName, { name: productName, quantity: 0, revenue: 0 });
          }
          
          const product = productSales.get(productName);
          product.quantity += quantite;
          product.revenue += revenu;
        });
      });

      // Ventes par jour
      const salesByDay = {};
      orders.forEach(order => {
        const dateKey = order.Date ? order.Date.substring(0, 10) : "Date inconnue";
        const total = parseFloat(order.Total) || 0;
        salesByDay[dateKey] = (salesByDay[dateKey] || 0) + total;
      });

      // Top produits
      const topProducts = Array.from(productSales.values())
        .sort((a, b) => b.quantity - a.quantity)
        .slice(0, 10);

      // Mise à jour du state
      state.analytics.totalRevenue = totalRevenue;
      state.analytics.totalOrders = totalOrders;
      state.analytics.avgOrderValue = avgOrderValue;
      state.analytics.topProducts = topProducts;
      state.analytics.statusDistribution = statusDistribution;
      state.analytics.salesByDay = salesByDay;
    }

    /* ===================== UI RENDER ===================== */
    function updateUI() {
      // Mise à jour des statistiques
      $("totalRevenue").textContent = formatPrice(state.analytics.totalRevenue);
      $("totalOrders").textContent = String(state.analytics.totalOrders);
      $("avgOrderValue").textContent = formatPrice(state.analytics.avgOrderValue);

      // Produit le plus vendu
      const bestProduct = state.analytics.topProducts[0];
      $("topProductName").textContent = bestProduct 
        ? `${bestProduct.name.substring(0, 20)}${bestProduct.name.length > 20 ? '...' : ''} (${bestProduct.quantity})`
        : "—";

      // Tableau de toutes les commandes
      const allOrdersBody = $("allOrdersBody");
      allOrdersBody.innerHTML = "";
      
      if (state.orders.length === 0) {
        allOrdersBody.innerHTML = `
          <tr>
            <td colspan="8" style="text-align:center; padding:30px; color:var(--muted)">
              Aucune commande trouvée
            </td>
          </tr>
        `;
      } else {
        state.orders.forEach(order => {
          const articlesText = order.Articles ? order.Articles.replace(/\n/g, '<br>') : '';
          
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${formatDate(order.Date)}</td>
            <td><strong>${safeText(order.Nom)}</strong></td>
            <td>${safeText(order.Téléphone)}</td>
            <td>${safeText(order.Adresse)}</td>
            <td><strong>${safeText(order.Commande)}</strong></td>
            <td class="articles-cell">${articlesText}</td>
            <td><strong>${formatPrice(order.Total)}</strong></td>
            <td>
              <select class="statut-select" 
                      data-commande="${order.Commande}"
                      onchange="window.updateOrderStatus('${order.Commande}', this.value)">
                <option value="En attente" ${order.Statut === 'En attente' ? 'selected' : ''}>En attente</option>
                <option value="En cours" ${order.Statut === 'En cours' ? 'selected' : ''}>En cours</option>
                <option value="Livrée" ${order.Statut === 'Livrée' ? 'selected' : ''}>Livrée</option>
                <option value="Annulée" ${order.Statut === 'Annulée' ? 'selected' : ''}>Annulée</option>
              </select>
            </td>
          `;
          allOrdersBody.appendChild(tr);
        });
      }

      // Tableau des top produits
      const topProductsBody = $("topProductsBody");
      topProductsBody.innerHTML = "";
      
      if (state.analytics.topProducts.length === 0) {
        topProductsBody.innerHTML = `
          <tr>
            <td colspan="3" style="text-align:center; padding:20px; color:var(--muted)">
              Aucune donnée de produit
            </td>
          </tr>
        `;
      } else {
        state.analytics.topProducts.forEach(product => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><div style="font-weight:900">${safeText(product.name)}</div></td>
            <td style="font-weight:900; color:var(--blue)">${product.quantity}</td>
            <td style="font-weight:900; color:var(--green)">${formatPrice(product.revenue)}</td>
          `;
          topProductsBody.appendChild(tr);
        });
      }
    }

    /* ===================== CHARTS ===================== */
    function initCharts() {
      // Chart des ventes
      const salesCtx = $("salesChart").getContext("2d");
      state.charts.sales = new Chart(salesCtx, {
        type: "line",
        data: { 
          labels: [], 
          datasets: [{ 
            label: "Chiffre d'affaires (dt)", 
            data: [], 
            borderWidth: 3, 
            fill: true, 
            tension: .35,
            borderColor: "#00ff88",
            backgroundColor: "rgba(0, 255, 136, 0.1)"
          }] 
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { 
            legend: { 
              labels: { 
                color: "#f0f6fc",
                font: { size: 12 }
              } 
            } 
          },
          scales: {
            x: { 
              ticks: { 
                color: "#8b949e",
                font: { size: 11 }
              }, 
              grid: { 
                color: "rgba(255,255,255,.10)" 
              } 
            },
            y: { 
              ticks: { 
                color: "#8b949e", 
                callback: (v) => formatPrice(v).replace(' dt', '')
              }, 
              grid: { 
                color: "rgba(255,255,255,.10)" 
              } 
            }
          }
        }
      });

      // Chart des statuts
      const statusCtx = $("statusChart").getContext("2d");
      state.charts.status = new Chart(statusCtx, {
        type: "doughnut",
        data: { 
          labels: [], 
          datasets: [{ 
            data: [], 
            borderWidth: 2,
            backgroundColor: [
              "rgba(255, 193, 7, 0.7)",   // En attente
              "rgba(33, 150, 243, 0.7)",   // En cours
              "rgba(76, 175, 80, 0.7)",    // Livrée
              "rgba(244, 67, 54, 0.7)"     // Annulée
            ],
            borderColor: [
              "rgba(255, 193, 7, 1)",
              "rgba(33, 150, 243, 1)",
              "rgba(76, 175, 80, 1)",
              "rgba(244, 67, 54, 1)"
            ]
          }] 
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { 
            legend: { 
              position: "right", 
              labels: { 
                color: "#f0f6fc",
                font: { size: 12 }
              } 
            } 
          }
        }
      });
    }

    function updateCharts() {
      // Chart des ventes
      const period = Number($("salesPeriod").value || 30);
      const salesByDay = state.analytics.salesByDay || {};
      
      const labels = [];
      const values = [];
      const today = new Date();
      
      for (let i = period - 1; i >= 0; i--) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        const dateKey = date.toISOString().substring(0, 10);
        labels.push(date.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" }));
        values.push(salesByDay[dateKey] || 0);
      }
      
      if (state.charts.sales) {
        state.charts.sales.data.labels = labels;
        state.charts.sales.data.datasets[0].data = values;
        state.charts.sales.update();
      }
      
      // Chart des statuts
      const statusDistribution = state.analytics.statusDistribution || {};
      const statusLabels = ["En attente", "En cours", "Livrée", "Annulée"];
      const statusData = statusLabels.map(label => statusDistribution[label] || 0);
      
      if (state.charts.status) {
        state.charts.status.data.labels = statusLabels;
        state.charts.status.data.datasets[0].data = statusData;
        state.charts.status.update();
      }
    }

    /* ===================== UPDATE ORDER STATUS ===================== */
    async function updateOrderStatus(commandeId, nouveauStatut) {
      try {
        showToast(`Mise à jour de ${commandeId}...`, "info");
        
        const response = await fetch(
          `${API_URL}?method=updateOrderStatus&commande_id=${encodeURIComponent(commandeId)}&statut=${encodeURIComponent(nouveauStatut)}&t=${Date.now()}`
        );
        
        if (!response.ok) {
          throw new Error(`Erreur HTTP: ${response.status}`);
        }
        
        const data = await response.json();
        
        if (!data.success) {
          throw new Error(data.error || "Erreur lors de la mise à jour");
        }
        
        // Mettre à jour localement
        const orderIndex = state.orders.findIndex(order => order.Commande === commandeId);
        if (orderIndex !== -1) {
          state.orders[orderIndex].Statut = nouveauStatut;
          calculateAnalytics();
          updateUI();
          updateCharts();
        }
        
        showToast(`✅ Statut mis à jour: ${nouveauStatut}`, "success");
        
      } catch (error) {
        console.error("Erreur updateOrderStatus:", error);
        showToast(`❌ Erreur: ${error.message}`, "error");
        
        // Recharger pour avoir les vraies données
        refreshAll();
      }
    }

    /* ===================== MAIN ===================== */
    async function refreshAll() {
      try {
        $("btnRefresh").disabled = true;
        
        await loadOrders();          // ✅ Charger depuis l'API
        calculateAnalytics();        // ✅ Calculer les statistiques
        updateUI();                  // ✅ Mettre à jour l'interface
        updateCharts();              // ✅ Mettre à jour les graphiques
        
        showToast("✅ Données chargées avec succès", "success");
        
      } catch (error) {
        console.error("Erreur refreshAll:", error);
        showToast("❌ Erreur lors du chargement", "error");
        
      } finally {
        $("btnRefresh").disabled = false;
      }
    }

    /* ===================== INITIALIZATION ===================== */
    document.addEventListener("DOMContentLoaded", () => {
      // Initialiser les graphiques
      initCharts();
      
      // Événements
      $("salesPeriod").addEventListener("change", () => updateCharts());
      $("btnRefresh").addEventListener("click", () => refreshAll());
      
      // Exposer la fonction de mise à jour
      window.updateOrderStatus = updateOrderStatus;
      
      // Premier chargement
      refreshAll();
      
      // Actualisation automatique toutes les 30 secondes
      setInterval(refreshAll, 30000);
    });
  </script>
