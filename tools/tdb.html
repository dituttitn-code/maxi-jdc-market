<!DOCTYPE html>
<html>
<head>
    <title>Tableau de Bord MAXI JDC</title>
    <style>
        body { 
            background: #0a1929; 
            color: white; 
            font-family: Arial; 
            margin: 0; 
            padding: 20px; 
        }
        .header { 
            text-align: center; 
            padding: 30px; 
            background: #112240; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            border: 3px solid #00d4ff;
        }
        .cards { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            justify-content: center; 
        }
        .card { 
            background: #1a365d; 
            padding: 20px; 
            border-radius: 10px; 
            width: 250px; 
            text-align: center;
            border: 2px solid rgba(0, 212, 255, 0.3);
        }
        .number { 
            font-size: 40px; 
            font-weight: bold; 
            color: #00ff88; 
            margin: 10px 0; 
        }
        button { 
            background: #00d4ff; 
            color: black; 
            border: none; 
            padding: 10px 20px; 
            margin: 10px; 
            border-radius: 5px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button:hover { 
            background: #00ff88; 
        }
        .time {
            color: #8b949e;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 TABLEAU DE BORD MAXI JDC</h1>
        <button onclick="window.location.href='index.html'">🏠 Accueil</button>
        <button onclick="refresh()">🔄 Actualiser</button>
        <div class="time" id="time">Chargement...</div>
    </div>
    
    <div class="cards">
        <div class="card">
            <h3>🛒 Commandes</h3>
            <div class="number" id="cmd">18</div>
            <p>Aujourd'hui</p>
        </div>
        
        <div class="card">
            <h3>💰 Chiffre d'affaires</h3>
            <div class="number" id="ca">1,250 DT</div>
            <p>Aujourd'hui</p>
        </div>
        
        <div class="card">
            <h3>👥 Clients</h3>
            <div class="number" id="cli">5</div>
            <p>Nouveaux</p>
        </div>
        
        <div class="card">
            <h3>📦 Stock</h3>
            <div class="number" id="stk">8</div>
            <p>Faible</p>
        </div>
    </div>
    
    <div style="text-align:center; margin-top:30px; color:#8b949e;">
        <p>✅ Tableau de bord en mode local - Données simulées</p>
    </div>
    
    <script>
        // Données locales
        let data = { 
            cmd: 18, 
            ca: 1250, 
            cli: 5, 
            stk: 8 
        };
        
        // Mettre à jour l'affichage
        function update() {
            // Légères variations aléatoires
            data.cmd += Math.floor(Math.random() * 3) - 1;
            if(data.cmd < 10) data.cmd = 10;
            
            data.ca += Math.floor(Math.random() * 100) - 50;
            if(data.ca < 800) data.ca = 800;
            
            // Afficher les données
            document.getElementById('cmd').textContent = data.cmd;
            document.getElementById('ca').textContent = data.ca.toLocaleString('fr-FR') + ' DT';
            document.getElementById('cli').textContent = data.cli;
            document.getElementById('stk').textContent = data.stk;
            
            // Mettre à jour l'heure
            const now = new Date();
            const timeStr = now.toLocaleTimeString('fr-FR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('time').textContent = 
                'Dernière mise à jour: ' + timeStr;
        }
        
        // Rafraîchir manuellement
        window.refresh = function() {
            update();
            alert('✅ Données actualisées !');
        };
        
        // Initialisation
        update();
        
        // Mettre à jour automatiquement toutes les 30 secondes
        setInterval(update, 30000);
    </script>
</body>
</html>
