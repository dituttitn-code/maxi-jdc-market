<!DOCTYPE html>
<html>
<head>
    <title>Tableau de Bord MAXI JDC</title>
    <style>
        body { 
            background: #0a1929; 
            color: white; 
            font-family: Arial; 
            margin: 0; 
            padding: 20px; 
        }
        .header { 
            text-align: center; 
            padding: 30px; 
            background: #112240; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            border: 3px solid #00d4ff;
        }
        .cards { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            justify-content: center; 
        }
        .card { 
            background: #1a365d; 
            padding: 20px; 
            border-radius: 10px; 
            width: 250px; 
            text-align: center;
            border: 2px solid rgba(0, 212, 255, 0.3);
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .number { 
            font-size: 40px; 
            font-weight: bold; 
            color: #00ff88; 
            margin: 10px 0; 
        }
        button { 
            background: #00d4ff; 
            color: black; 
            border: none; 
            padding: 10px 20px; 
            margin: 10px; 
            border-radius: 5px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.3s;
        }
        button:hover { 
            background: #00ff88; 
        }
        .time {
            color: #8b949e;
            margin-top: 10px;
            font-size: 14px;
        }
        .trend {
            font-size: 12px;
            margin-top: 5px;
        }
        .up { color: #00ff88; }
        .down { color: #ff5555; }
        .loading {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 TABLEAU DE BORD MAXI JDC</h1>
        <button onclick="window.location.href='index.html'">🏠 Accueil</button>
        <button onclick="refresh()" id="refreshBtn">🔄 Actualiser</button>
        <div class="time" id="time">Chargement...</div>
    </div>
    
    <div class="cards">
        <div class="card" id="cmdCard">
            <h3>🛒 Commandes</h3>
            <div class="number" id="cmd">--</div>
            <p>Aujourd'hui</p>
            <div class="trend" id="cmdTrend"></div>
        </div>
        
        <div class="card" id="caCard">
            <h3>💰 Chiffre d'affaires</h3>
            <div class="number" id="ca">-- DT</div>
            <p>Aujourd'hui</p>
            <div class="trend" id="caTrend"></div>
        </div>
        
        <div class="card" id="cliCard">
            <h3>👥 Clients</h3>
            <div class="number" id="cli">--</div>
            <p>Nouveaux</p>
            <div class="trend" id="cliTrend"></div>
        </div>
        
        <div class="card" id="stkCard">
            <h3>📦 Stock</h3>
            <div class="number" id="stk">--</div>
            <p>Produits en alerte</p>
            <div class="trend" id="stkTrend"></div>
        </div>
    </div>
    
    <div style="text-align:center; margin-top:30px; color:#8b949e;">
        <p>✅ Tableau de bord en temps réel - Données simulées</p>
        <p>📈 Mise à jour automatique toutes les 30 secondes</p>
    </div>
    
    <script>
        // Données initiales réalistes
        let data = { 
            cmd: 18, 
            ca: 1250, 
            cli: 5, 
            stk: 8 
        };
        
        // Anciennes valeurs pour calculer les tendances
        let oldData = { ...data };
        
        // Mettre à jour l'affichage avec effet de chargement
        async function update() {
            // Ajouter l'effet de chargement
            document.getElementById('refreshBtn').disabled = true;
            document.getElementById('refreshBtn').innerHTML = '⏳ Chargement...';
            
            // Simuler un délai de chargement (comme une vraie API)
            await new Promise(resolve => setTimeout(resolve, 500));
            
            // Sauvegarder les anciennes valeurs
            oldData = { ...data };
            
            // Générer de nouvelles données réalistes
            data.cmd += Math.floor(Math.random() * 5) - 2;
            if(data.cmd < 0) data.cmd = 0;
            
            data.ca += Math.floor(Math.random() * 200) - 100;
            if(data.ca < 500) data.ca = 500;
            
            data.cli += Math.floor(Math.random() * 3) - 1;
            if(data.cli < 0) data.cli = 0;
            
            data.stk += Math.floor(Math.random() * 3) - 1;
            if(data.stk < 0) data.stk = 0;
            if(data.stk > 15) data.stk = 15;
            
            // Afficher les données avec animation
            animateValue('cmd', data.cmd, oldData.cmd);
            document.getElementById('ca').textContent = data.ca.toLocaleString('fr-FR') + ' DT';
            animateValue('cli', data.cli, oldData.cli);
            animateValue('stk', data.stk, oldData.stk);
            
            // Mettre à jour les tendances
            updateTrend('cmdTrend', data.cmd, oldData.cmd);
            updateTrend('caTrend', data.ca, oldData.ca);
            updateTrend('cliTrend', data.cli, oldData.cli);
            updateTrend('stkTrend', data.stk, oldData.stk, true); // Inversé pour le stock
            
            // Mettre à jour l'heure
            const now = new Date();
            const timeStr = now.toLocaleTimeString('fr-FR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('time').innerHTML = 
                '🕒 Dernière mise à jour: <strong>' + timeStr + '</strong>';
            
            // Retirer l'effet de chargement
            document.getElementById('refreshBtn').disabled = false;
            document.getElementById('refreshBtn').innerHTML = '🔄 Actualiser';
        }
        
        // Animation de changement de valeur
        function animateValue(id, newVal, oldVal) {
            const element = document.getElementById(id);
            const duration = 500;
            const start = oldVal;
            const end = newVal;
            const startTime = Date.now();
            
            function updateNumber() {
                const now = Date.now();
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const currentValue = Math.floor(start + (end - start) * progress);
                element.textContent = currentValue;
                
                if (progress < 1) {
                    requestAnimationFrame(updateNumber);
                } else {
                    element.textContent = end;
                }
            }
            
            updateNumber();
        }
        
        // Mettre à jour les indicateurs de tendance
        function updateTrend(elementId, newVal, oldVal, inverted = false) {
            const element = document.getElementById(elementId);
            const diff = newVal - oldVal;
            
            if (diff === 0) {
                element.textContent = '→ Stable';
                element.className = 'trend';
            } else {
                const isPositive = inverted ? diff < 0 : diff > 0;
                const symbol = isPositive ? '↗' : '↘';
                const colorClass = isPositive ? 'up' : 'down';
                element.textContent = `${symbol} ${Math.abs(diff)}`;
                element.className = `trend ${colorClass}`;
            }
        }
        
        // Rafraîchir manuellement
        window.refresh = function() {
            update();
        };
        
        // Initialisation
        update();
        
        // Mettre à jour automatiquement toutes les 30 secondes
        setInterval(update, 30000);
        
        // Ajouter des événements pour les cartes
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', function() {
                const title = this.querySelector('h3').textContent;
                alert(`Détails pour: ${title}\nValeur: ${this.querySelector('.number').textContent}`);
            });
        });
    </script>
</body>
</html>
