<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection Tableau de Bord</title>
    <meta http-equiv="refresh" content="0; url=tools/tableau-de-bord.html">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a1929, #112240);
            color: #f0f6fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(22, 36, 71, 0.9);
            border-radius: 20px;
            border: 3px solid #00ff88;
            box-shadow: 0 15px 50px rgba(0, 255, 136, 0.2);
        }
        h1 {
            color: #00ff88;
            margin-bottom: 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(0, 255, 136, 0.3);
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #00ff88;
            color: #0a1929;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #00d46b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Tableau de Bord Administratif</h1>
        <p>Redirection vers le tableau de bord de MAXI JDC MARKET...</p>
        <div class="spinner"></div>
        <p>Si la redirection ne fonctionne pas automatiquement :</p>
        <a href="tools/tableau-de-bord.html" class="btn">
            🔗 Accéder au Tableau de Bord
        </a>
        <p style="margin-top: 20px; font-size: 14px; color: #8b949e;">
            <a href="index.html" style="color: #00d4ff;">← Retour à l'accueil</a>
        </p>
    </div>
</body>
</html>
