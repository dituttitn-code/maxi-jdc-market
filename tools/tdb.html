<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord Admin - MAXI JDC MARKET</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #112240;
            --text-light: #ff6fc7;
            --text-muted: #8b949e;
            --accent-green: #00ff88;
            --accent-blue: #00d4ff;
            --warning: #ffa726;
            --danger: #ff6b6b;
            --success: #4ca5f0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #aa1929 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 2px solid var(--accent-blue);
        }
        
        .header h1 {
            color: var(--accent-blue);
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: var(--text-muted);
        }
        
        .back-btn {
            display: inline-block;
            margin: 20px 0;
            padding: 12px 25px;
            background: var(--accent-blue);
            color: #112240;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: var(--accent-green);
            transform: translateY(-2px);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 25px;
            border-radius: 10px;
            border-left: 5px solid var(--accent-green);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card h3 {
            color: var(--text-muted);
            font-size: 1em;
            margin-bottom: 10px;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--accent-green);
        }
        
        .stat-icon {
            font-size: 2em;
            margin-bottom: 15px;
            color: var(--accent-blue);
        }
        
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        
        .action-btn {
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--accent-blue);
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent-blue);
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .action-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: translateY(-3px);
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-tachometer-alt"></i> Tableau de Bord Admin</h1>
            <p>MAXI JDC MARKET - Gestion et statistiques</p>
        </div>
        
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Retour à l'application
        </a>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-shopping-cart"></i>
                </div>
                <h3>Commandes aujourd'hui</h3>
                <div class="stat-value" id="ordersToday">18</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-users"></i>
                </div>
                <h3>Nouveaux clients</h3>
                <div class="stat-value" id="newClients">7</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-chart-line"></i>
                </div>
                <h3>Chiffre d'affaires</h3>
                <div class="stat-value" id="revenue">2.8k€</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-box"></i>
                </div>
                <h3>Stock alerte</h3>
                <div class="stat-value" id="lowStock">12</div>
            </div>
        </div>
        
        <div class="quick-actions">
            <a href="#" class="action-btn">
                <i class="fas fa-file-csv"></i>
                <span>Exporter les données</span>
            </a>
            <a href="#" class="action-btn">
                <i class="fas fa-chart-bar"></i>
                <span>Voir les statistiques</span>
            </a>
            <a href="#" class="action-btn">
                <i class="fas fa-cog"></i>
                <span>Paramètres</span>
            </a>
            <a href="#" class="action-btn">
                <i class="fas fa-question-circle"></i>
                <span>Aide & Support</span>
            </a>
        </div>
    </div>
    
    <script>
        console.log("Tableau de bord admin chargé");
        
        setTimeout(() => {
            document.getElementById('ordersToday').textContent = '24';
            document.getElementById('newClients').textContent = '9';
        }, 1000);
    </script>
</body>
</html>
