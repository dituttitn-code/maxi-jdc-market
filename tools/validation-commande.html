<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root{
      --bg:#05070a;
      --panel:#0e1622;
      --panel2:#0b1220;
      --border:#12e6a5;
      --border2:#0ecf95;
      --text:#e8f1ff;

    .pill{

      gap:8px;
      padding:6px 12px;
      border-radius:999px;

    .pill.processing{

      background: rgba(126,87,194,.12);

    }
    .pill.delivered{

      background: rgba(76,175,80,.12);
      color:#c8e6c9;
    }
    .pill.cancelled{

      background: rgba(255,92,92,.12);
      color:#ffcdd2;
    }
    .toast{

      left:50%;

    .small{

    .row{

      align-items:center;
      justify-content:space-between;

      background: rgba(255,167,38,.15);

<body>

  <div class="modal" role="dialog" aria-modal="true" aria-label="Validation commande">

        <span class="dot"><i class="fas fa-check"></i></span>

        </div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxEJ85cUAD03yDXY7PexjWhQaQD4uUPAeTwUANP5d6na39amSHyvUM-2RSwiSnGdBug/exec";
const WHATSAPP_NUMBER = "0021625600978";

function analyserDonneesCommande(rawData) {
  const result = {
    nom: "",
    telephone: "",
    adresse: "",
    articles: [],
    total: 0,
    numero_commande: "TEMP-" + Date.now(),
    date: new Date().toISOString(),
    statut: "En attente"
  };

  if (typeof rawData === "string") {
    const lignes = rawData.split('\n').map(l => l.trim()).filter(l => l);
    
    let section = "none";
    
    lignes.forEach(ligne => {
      if (ligne.includes("Détails de votre commande") || 
          ligne.includes("Informations client") ||
          ligne.includes("👤") || ligne.includes("📞") || ligne.includes("📍")) {
        section = "details";
        return;
      }
      
      if (ligne.includes("Articles commandés") || 
          ligne.includes("🛒") || 
          ligne.includes("ARTICLES") ||
          /^\d+x\s/.test(ligne)) {
        section = "articles";
        if (!ligne.includes("Articles commandés") && !ligne.includes("🛒")) {
          parserArticle(ligne, result.articles);
        }
        return;
      }
      
      if (ligne.includes("TOTAL") || 
          ligne.includes("💰") || 
          ligne.includes("Total") ||
          ligne.includes("MAXI-") ||
          /^\d+\.\d{3}\s*(DT|dt|TND)/.test(ligne)) {
        section = "total";
      }

      switch(section) {
        case "details":
          if (ligne.includes("Nom:") || ligne.includes("👤")) {
            result.nom = ligne.replace(/Nom:|👤/g, "").trim();
          } else if (ligne.includes("Téléphone:") || ligne.includes("📞") || /\+216/.test(ligne)) {
            result.telephone = ligne.replace(/Téléphone:|📞/g, "").trim();
          } else if (ligne.includes("Adresse:") || ligne.includes("📍")) {
            result.adresse = ligne.replace(/Adresse:|📍/g, "").trim();
          }
          break;
          
        case "articles":
          if (ligne.trim() && !ligne.includes("Articles commandés") && !ligne.includes("🛒")) {
            parserArticle(ligne, result.articles);
          }
          break;
          
        case "total":
          if (ligne.includes("MAXI-") || ligne.includes("Commande #")) {
            result.numero_commande = ligne.replace(/Commande #/g, "").trim();
          }
          else if (ligne.includes("TOTAL") || ligne.includes("💰") || ligne.includes("Total:")) {
            const totalMatch = ligne.match(/(\d+\.?\d*)\s*(DT|dt|TND|tnd)/i);
            if (totalMatch) {
              result.total = parseFloat(totalMatch[1]);
            }
          }
          break;
      }
    });
  } else if (typeof rawData === "object") {
    Object.assign(result, rawData);
  }

  return result;
}

function parserArticle(ligne, articlesArray) {
  ligne = ligne.trim();
  
  const match1 = ligne.match(/(\d+)\s*x\s*([^-]+)-\s*(\d+\.?\d*)\s*(DT|dt|TND|tnd)?/i);
  if (match1) {
    articlesArray.push({
      produit: match1[2].trim(),
      quantite: parseInt(match1[1]),
      prix_unitaire: parseFloat(match1[3]),
      prix_total: parseInt(match1[1]) * parseFloat(match1[3])
    });
    return;
  }
  
  const match2 = ligne.match(/(.+):\s*(\d+\.?\d*)\s*(DT|dt|TND|tnd)?\s*x\s*(\d+)/i);
  if (match2) {
    articlesArray.push({
      produit: match2[1].trim(),
      quantite: parseInt(match2[4]),
      prix_unitaire: parseFloat(match2[2]),
      prix_total: parseInt(match2[4]) * parseFloat(match2[2])
    });
    return;
  }
  
  const match3 = ligne.match(/(\d+)\s*x\s*(.+)/i);
  if (match3) {
    articlesArray.push({
      produit: match3[2].trim(),
      quantite: parseInt(match3[1]),
      prix_unitaire: 0,
      prix_total: 0
    });
  }
}

function formatPrice(amount) {
  const num = parseFloat(String(amount || '0').replace(',', '.')) || 0;
  return num.toFixed(3).replace('.', ',') + ' DT';
}

function afficherSectionsStructurees(commande) {
  const container = document.getElementById("sectionsContainer");
  
  let html = `
    <div class="section details">
      <div class="section-header">
        <i class="fas fa-user"></i>
        <span>Détails client</span>
      </div>
      <div class="section-content">
        <div class="info-row">
          <div class="info-label">👤 Nom:</div>
          <div class="info-value">${commande.nom || "Non spécifié"}</div>
        </div>
        <div class="info-row">
          <div class="info-label">📞 Téléphone:</div>
          <div class="info-value">${commande.telephone || "Non spécifié"}</div>
        </div>
        <div class="info-row">
          <div class="info-label">📍 Adresse:</div>
          <div class="info-value">${commande.adresse || "Non spécifié"}</div>
        </div>
      </div>
    </div>
  `;
  
  html += `
    <div class="section articles">
      <div class="section-header">
        <i class="fas fa-shopping-cart"></i>
        <span>Articles commandés</span>
      </div>
      <div class="section-content">
  `;
  
  if (commande.articles && commande.articles.length > 0) {
    commande.articles.forEach((article) => {
      html += `
        <div class="article-item">
          <div class="article-name">${article.produit}</div>
          <div class="article-qty">${article.quantite}x</div>
          <div class="article-price">${article.prix_unitaire ? formatPrice(article.prix_unitaire) : '—'}</div>
        </div>
      `;
    });
  } else {
    html += `<div style="color: var(--muted); font-style: italic;">Aucun article détaillé</div>`;
  }
  
  html += `</div></div>`;
  
  html += `
    <div class="section total">
      <div class="section-header">
        <i class="fas fa-file-invoice-dollar"></i>
        <span>Récapitulatif</span>
      </div>
      <div class="section-content">
        <div class="info-row">
          <div class="info-label">🆔 N° Commande:</div>
          <div class="info-value" style="font-family: monospace;" id="numeroCommandeDisplay">${commande.numero_commande}</div>
        </div>
        <div class="info-row">
          <div class="info-label">💰 Total:</div>
          <div class="info-value" style="font-weight: bold; color: #a8ffe8;">
            ${formatPrice(commande.total)}
          </div>
        </div>
        <div class="info-row">
          <div class="info-label">📅 Date:</div>
          <div class="info-value">${new Date(commande.date).toLocaleDateString('fr-FR', {
            day: '2-digit',
            month: 'long',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          })}</div>
        </div>
      </div>
    </div>
  `;
  
  container.innerHTML = html;
  document.getElementById("orderIdText").textContent = commande.numero_commande || "—";
  document.getElementById("statusText").textContent = commande.statut || "En attente";
  
  const statusPill = document.getElementById("statusPill");
  statusPill.className = "pill " + (commande.statut ? commande.statut.toLowerCase().replace(/ /g, '-') : 'pending');
}

function showToast(text, type = "ok") {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.className = "toast show " + type;
  setTimeout(() => el.className = "toast", 3200);
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 0);
}

function playTabletSound() {
  try {
    document.getElementById("soundAlert").classList.add("show");
    setTimeout(() => {
      document.getElementById("soundAlert").classList.remove("show");
    }, 5000);
  } catch (error) {
    console.warn("Son non supporté:", error);
  }
}

async function envoyerCommandeAPI(commande) {
  try {
    const payload = {
      method: "saveOrder",
      nom: commande.nom,
      telephone: commande.telephone,
      adresse: commande.adresse,
      articles: JSON.stringify(commande.articles),
      total: commande.total.toFixed(3)
    };

    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams(payload).toString()
    });
    
    const result = await response.json();
    console.log("📊 Données envoyées à Google Sheets:", payload);
    console.log("✅ Réponse Google Sheets:", result);
    return result;
    
  } catch (error) {
    console.error("Erreur envoi API:", error);
    return { success: false, error: error.message };
  }
}

async function validerEtEnvoyerCommande(commande) {
  console.log("🟢 Validation de la commande:", commande);
  
  const result = await envoyerCommandeAPI(commande);
  
  if (result.success) {
    const numeroSheets = result.commande_id || result.numero_commande || result.orderId || result.id || result.numero;
    
    console.log("✅ Numéro de Google Sheets:", numeroSheets);
    
    document.getElementById("orderIdText").textContent = numeroSheets;
    
    const numeroDisplay = document.getElementById("numeroCommandeDisplay");
    if (numeroDisplay) {
      numeroDisplay.textContent = numeroSheets;
    }
    
    const toast = document.getElementById("toast");
    toast.innerHTML = `✅ Commande Enregistrée

Merci pour votre commande chez MAXI JDC MARKET.

📦 Votre commande, référence ${numeroSheets}, a bien été enregistrée.
⏳ Elle est actuellement en cours de préparation.
📞 Nous vous contacterons prochainement pour la livraison.

🔗 Pour suivre l'état de votre commande, utilisez le numéro ${numeroSheets} dans la section « Suivi commande » de votre espace client.

📋 Copier le numéro: ${numeroSheets}`;
    toast.className = "toast show ok";
    
    playTabletSound();
    
    const message = `🛒 NOUVELLE COMMANDE VALIDÉE\n\n` +
                   `Client: ${commande.nom}\n` +
                   `Téléphone: ${commande.telephone}\n` +
                   `Adresse: ${commande.adresse}\n` +
                   `N° Commande: ${numeroSheets}\n` +
                   `Total: ${formatPrice(commande.total)}`;
    
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, "_blank");
    
    console.log("✅ Affichage mis à jour avec le numéro:", numeroSheets);
    
  } else {
    showToast("❌ Erreur: " + (result.error || "Inconnue"), "err");
  }
}

function ouvrirWhatsAppClient(commande) {
  if (!commande.telephone) {
    showToast("❌ Numéro client manquant", "err");
    return;
  }
  
  const phone = commande.telephone.replace(/\D/g, '');
  const tnPhone = phone.length === 8 ? "216" + phone : phone.startsWith("216") ? phone : "216" + phone;
  
  const message = `Bonjour ${commande.nom || ''},\n\n` +
                 `Votre commande ${commande.numero_commande} a été reçue.\n` +
                 `Statut: ${commande.statut}\n` +
                 `Total: ${formatPrice(commande.total)}\n\n` +
                 `Merci pour votre confiance !`;
  
  window.open(`https://wa.me/${tnPhone}?text=${encodeURIComponent(message)}`, "_blank");
}

function getDonneesCommande() {
  const params = new URLSearchParams(location.search);
  const rawData = params.get("data") || params.get("commande") || "";
  
  if (rawData) {
    return analyserDonneesCommande(rawData);
  }
  
  try {
    const saved = localStorage.getItem("maxi_commande_en_cours");
    if (saved) {
      return analyserDonneesCommande(JSON.parse(saved));
    }
  } catch (e) {
    console.warn("Erreur lecture localStorage:", e);
  }
  
  return analyserDonneesCommande("");
}

document.addEventListener("DOMContentLoaded", () => {
  const commande = getDonneesCommande();
  afficherSectionsStructurees(commande);
  
  const isNew = new URLSearchParams(location.search).get("new") === "true";
  if (isNew) {
    setTimeout(() => {
      playTabletSound();
      showToast("🎉 Nouvelle commande reçue !", "ok");
    }, 1000);
  }
});

document.getElementById("validateSendBtn").addEventListener("click", () => {
  const commande = getDonneesCommande();
  validerEtEnvoyerCommande(commande);
});

document.getElementById("downloadBtn").addEventListener("click", () => {
  const commande = getDonneesCommande();
  const text = `COMMANDE MAXI JDC MARKET\n\n` +
              `N°: ${commande.numero_commande}\n` +
              `Date: ${new Date(commande.date).toLocaleString('fr-FR')}\n` +
              `Client: ${commande.nom}\n` +
              `Téléphone: ${commande.telephone}\n` +
              `Adresse: ${commande.adresse}\n` +
              `Total: ${formatPrice(commande.total)}\n` +
              `Statut: ${commande.statut}\n\n` +
              `Articles:\n${commande.articles.map(a => `${a.quantite}x ${a.produit} - ${formatPrice(a.prix_unitaire)}`).join('\n')}`;
  
  downloadText(`commande-maxi-${commande.numero_commande}.txt`, text);
  showToast("📥 Commande téléchargée", "ok");
});

document.getElementById("whatsappBtn").addEventListener("click", () => {
  const commande = getDonneesCommande();
  ouvrirWhatsAppClient(commande);
});

document.getElementById("cancelBtn").addEventListener("click", () => {
  if (confirm("Êtes-vous sûr de vouloir annuler cette commande ?")) {
    showToast("❌ Commande annulée", "err");
    setTimeout(() => {
      window.close();
    }, 1500);
  }
});

document.getElementById("closeBtn").addEventListener("click", () => {
  window.close();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.getElementById("closeBtn").click();
  if (e.ctrlKey && e.key === "s") {
    e.preventDefault();
    document.getElementById("validateSendBtn").click();
  }
});
</script>
</body>
</html>
