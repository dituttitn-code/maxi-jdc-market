<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Validation commande - MAXI JDC MARKET</title>

  <!-- CONFIGURATION CENTRALE -->
  <script src="config.js"></script>
  
  <!-- PROTECTION ANTI-DOUBLON -->
  <script src="validation-protection.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* [LE CSS RESTE IDENTIQUE - PAS DE CHANGEMENT] */
    :root {
      --bg: #05070a;
      --panel: #0e1622;
      --panel2: #0b1220;
      --border: #12e6a5;
      --border2: #0ecf95;
      --text: #e8f1ff;
      --muted: #93a4be;
      --btn: #122235;
      --btn2: #0f1b2b;
      --danger: #ff5c5c;
      --ok: #20e3b2;
      --warning: #ffa726;
      --info: #2196f3;
      --processing: #7e57c2;
      --delivered: #4caf50;
      --cancelled: #ff5252;
      --shadow: 0 18px 55px rgba(0,0,0,.6);
      --radius: 16px;
      --radius2: 12px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      font-family: var(--sans);
      background: radial-gradient(1200px 800px at 50% 20%, rgba(18,230,165,.16), transparent 60%),
                  radial-gradient(900px 700px at 15% 70%, rgba(30,144,255,.10), transparent 55%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    
    .modal {
      width: min(680px, 96vw);
      background: linear-gradient(180deg, rgba(18,230,165,.08), rgba(18,230,165,.02) 35%, rgba(0,0,0,0)),
                  var(--panel);
      border: 2px solid rgba(18,230,165,.55);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(18,230,165,.28);
      background: rgba(8, 18, 28, .65);
    }
    
    .title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #a8ffe8;
      letter-spacing: .2px;
    }
    
    .title .dot {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 2px solid rgba(18,230,165,.9);
      background: rgba(18,230,165,.18);
      display: grid;
      place-items: center;
      font-size: 12px;
      line-height: 1;
    }
    
    .close {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    
    .close:hover {
      border-color: rgba(18,230,165,.55);
      transform: rotate(90deg);
    }
    
    .content {
      padding: 16px;
    }
    
    .sections {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }
    
    .section {
      background: rgba(0,0,0,.2);
      border-radius: 10px;
      padding: 12px;
      border-left: 3px solid var(--border);
    }
    
    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: #a8ffe8;
      font-weight: 600;
    }
    
    .section-content {
      font-size: 13px;
      line-height: 1.5;
    }
    
    .section.details {
      border-left-color: #2196f3;
    }
    
    .section.articles {
      border-left-color: #4caf50;
    }
    
    .section.total {
      border-left-color: #ff9800;
    }
    
    .info-row {
      display: flex;
      margin: 6px 0;
    }
    
    .info-label {
      flex: 0 0 100px;
      color: var(--muted);
      font-size: 12px;
    }
    
    .info-value {
      flex: 1;
      font-weight: 500;
    }
    
    .article-item {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    
    .article-name {
      flex: 2;
    }
    
    .article-qty {
      flex: 0 0 50px;
      text-align: center;
      color: var(--muted);
    }
    
    .article-price {
      flex: 0 0 80px;
      text-align: right;
    }
    
    .footer {
      display: flex;
      gap: 12px;
      padding: 14px 16px 16px;
      border-top: 1px solid rgba(18,230,165,.20);
      background: rgba(8, 18, 28, .55);
      flex-wrap: wrap;
    }
    
    .btn {
      flex: 1;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: var(--btn);
      color: var(--text);
      padding: 12px 12px;
      cursor: pointer;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.30);
      transition: all 0.15s ease;
      min-width: 140px;
    }
    
    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(18,230,165,.45);
    }
    
    .btn:active {
      transform: translateY(0px);
      opacity: .95;
    }
    
    .btn.secondary {
      background: var(--btn2);
    }
    
    .btn.whatsapp {
      border-color: rgba(18,230,165,.55);
      background: linear-gradient(180deg, rgba(18,230,165,.18), rgba(18,230,165,.08));
      box-shadow: 0 10px 30px rgba(18,230,165,.10);
    }
    
    .btn.validate {
      background: linear-gradient(180deg, rgba(18,230,165,.18), rgba(18,230,165,.08)),
                  var(--btn);
      border-color: rgba(18,230,165,.70);
      color: #c9fff0;
    }
    
    .btn.cancel {
      border-color: rgba(255,92,92,.55);
      background: linear-gradient(180deg, rgba(255,92,92,.18), rgba(255,92,92,.08));
      color: #ffb3b3;
    }
    
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--muted);
      font-family: var(--sans);
      font-weight: 700;
      font-size: 12px;
      margin: 10px 0 0;
    }
    
    .pill strong {
      color: #cfe3ff;
    }
    
    .pill.pending {
      border-color: rgba(255,167,38,.35);
      background: rgba(255,167,38,.12);
      color: #ffcc80;
    }
    
    .pill.validated {
      border-color: rgba(18,230,165,.35);
      background: rgba(18,230,165,.12);
      color: #b2ebf2;
    }
    
    .pill.processing {
      border-color: rgba(126,87,194,.35);
      background: rgba(126,87,194,.12);
      color: #d1c4e9;
    }
    
    .pill.delivered {
      border-color: rgba(76,175,80,.35);
      background: rgba(76,175,80,.12);
      color: #c8e6c9;
    }
    
    .pill.cancelled {
      border-color: rgba(255,92,92,.35);
      background: rgba(255,92,92,.12);
      color: #ffcdd2;
    }
    
    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,18,28,.92);
      border: 1px solid rgba(255,255,255,.12);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      font-size: 13px;
      display: none;
      max-width: min(680px, 92vw);
      z-index: 10000;
    }
    
    .toast.show {
      display: block;
      animation: slideUp 0.3s ease;
    }
    
    .toast.ok {
      border-color: rgba(18,230,165,.55);
    }
    
    .toast.err {
      border-color: rgba(255,92,92,.55);
    }
    
    .whatsapp-info {
      margin-top: 15px;
      padding: 10px;
      background: rgba(18,230,165,.08);
      border: 1px solid rgba(18,230,165,.2);
      border-radius: 8px;
      font-size: 13px;
    }
    
    .whatsapp-info i {
      color: #25D366;
    }
    
    .whatsapp-info small {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }
    
    .sound-alert {
      display: none;
      padding: 10px;
      background: rgba(255,167,38,.15);
      border: 1px solid rgba(255,167,38,.3);
      border-radius: 8px;
      margin-top: 10px;
      text-align: center;
    }
    
    .sound-alert.show {
      display: block;
      animation: pulse 1s infinite;
    }
    
    .status-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    
    .status-btn {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid;
      font-size: 11px;
      cursor: pointer;
      background: rgba(255,255,255,.05);
      color: var(--text);
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .status-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    
    .status-btn.validate {
      border-color: var(--ok);
      color: var(--ok);
    }
    
    .status-btn.processing {
      border-color: var(--processing);
      color: #d1c4e9;
    }
    
    .status-btn.delivered {
      border-color: var(--delivered);
      color: #c8e6c9;
    }
    
    .status-btn.cancel {
      border-color: var(--cancelled);
      color: #ffcdd2;
    }
    
    .receipt-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(18, 230, 165, 0.3);
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      font-family: var(--mono);
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #d7e6ff;
    }
    
    .validation-steps {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      border-left: 3px solid var(--info);
    }
    
    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
    }
    
    .step i {
      font-size: 14px;
    }
    
    .step.completed {
      color: var(--ok);
    }
    
    .step.pending {
      color: var(--warning);
    }
    
    .step.error {
      color: var(--danger);
    }
    
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(5, 7, 10, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      display: none;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(18, 230, 165, 0.3);
      border-top-color: var(--border);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }
    
    @keyframes slideUp {
      from {
        transform: translateX(-50%) translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }
    
    @media (max-width: 768px) {
      .footer {
        flex-direction: column;
      }
      
      .btn {
        min-width: 100%;
      }
      
      .status-actions {
        justify-content: center;
      }
      
      .row {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .info-label {
        flex: 0 0 80px;
      }
    }
    
    @media (max-width: 480px) {
      .content {
        padding: 12px;
      }
      
      .footer {
        padding: 12px;
      }
      
      .btn {
        padding: 10px 12px;
        font-size: 14px;
      }
      
      .info-label {
        flex: 0 0 70px;
        font-size: 11px;
      }
      
      .info-value {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
  </div>

  <div class="modal" role="dialog" aria-modal="true" aria-label="Validation commande">
    <div class="header">
      <div class="title">
        <span class="dot"><i class="fas fa-check"></i></span>
        <span id="headerTitle">Validation commande</span>
      </div>
      <button class="close" id="closeBtn" title="Fermer">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="content">
      <!-- Affichage structuré en sections -->
      <div class="sections" id="sectionsContainer">
        <!-- Les sections seront générées dynamiquement -->
      </div>

      <!-- Aperçu reçu -->
      <div class="receipt-box" id="receiptPreview">

        <div id="receiptContent">Chargement...</div>
      </div>

      <!-- Étapes de validation -->
      <div class="validation-steps" id="validationSteps">
        <div class="step pending">
          <i class="fas fa-circle-notch fa-spin"></i>
          <span>Préparation de la commande...</span>
        </div>
      </div>

      <div class="row">
        <div class="pill pending" id="statusPill">
          <i class="fas fa-info-circle"></i> Statut : <strong id="statusText">En attente</strong>
        </div>

        <div class="pill">
          <i class="fas fa-hashtag"></i> Commande : <strong id="orderIdText">—</strong>
        </div>
      </div>

      <div class="sound-alert" id="soundAlert">
        <i class="fas fa-bell"></i> 🔊 Son de notification joué sur la tablette du magasin
      </div>
      
      <!-- Actions de statut -->
      <div class="status-actions" id="statusActions">
        <button class="status-btn validate" onclick="changerStatut('Validée')">
          <i class="fas fa-check"></i> Valider
        </button>
        <button class="status-btn processing" onclick="changerStatut('En traitement')">
          <i class="fas fa-cogs"></i> En traitement
        </button>
        <button class="status-btn delivered" onclick="changerStatut('Livrée')">
          <i class="fas fa-truck"></i> Livrée
        </button>
        <button class="status-btn cancel" onclick="changerStatut('Annulée')">
          <i class="fas fa-times"></i> Annuler
        </button>
      </div>
      
      <div class="whatsapp-info">
        <i class="fab fa-whatsapp"></i> <strong>WhatsApp Business:</strong> +216 25 600 978<br>
        <small>Votre commande sera envoyée au WhatsApp du magasin</small>
      </div>
    </div>

    <div class="footer">
      <button class="btn validate" id="validateSendBtn">
        <i class="fas fa-check-double"></i> ✅ Valider et envoyer
      </button>
      <button class="btn secondary" id="downloadBtn">
        <i class="fas fa-download"></i> 📥 Télécharger
      </button>
      <button class="btn whatsapp" id="whatsappBtn">
        <i class="fab fa-whatsapp"></i> 📱 WhatsApp
      </button>
      <button class="btn cancel" id="cancelBtn">
        <i class="fas fa-times"></i> ❌ Annuler
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /**
     * ==========================
     *  CONFIGURATION
     * ==========================
     */
    const WHATSAPP_NUMBER = window.APP_CONFIG ? APP_CONFIG.whatsappNumber : "21625600978";
    const GOOGLE_SHEETS_API = window.APP_CONFIG ? APP_CONFIG.googleSheetsApi : null;
    const API_BASE_URL = window.APP_CONFIG ? APP_CONFIG.apiUrl : "https://script.google.com/macros/s/AKfycbzG_QXj2qF1Rc7r9VTxWaLl-j7alC9iXLFcP-fTFIfP66zCEMQUogw_xdeq79B6f4_m/exec";

    // Variables globales
    let currentOrder = null;
    let validationInProgress = false;

    /**
     * ==========================
     *  ANALYSER LES DONNÉES COMMANDE
     * ==========================
     */
    function analyserDonneesCommande(rawData) {
      const result = {
        nom: "",
        telephone: "",
        adresse: "",
        articles: [],
        total: 0,
        numero_commande: "",
        date: new Date().toISOString(),
        statut: "En attente",
        source: "direct"
      };

      // Si c'est un objet JSON
      if (typeof rawData === 'object' && rawData !== null) {
        Object.assign(result, rawData);
        
        // S'assurer que les articles sont un tableau
        if (result.articles && typeof result.articles === 'string') {
          try {
            result.articles = JSON.parse(result.articles);
          } catch (e) {
            result.articles = [];
          }
        }
        
        return result;
      }

      // Si c'est une chaîne de texte
      if (typeof rawData === "string") {
        const lignes = rawData.split('\n').map(l => l.trim()).filter(l => l);
        
        let section = "none";
        
        lignes.forEach(ligne => {
          // Détection des sections
          if (ligne.includes("Détails") || ligne.includes("Informations") || 
              ligne.includes("👤") || ligne.includes("📞") || ligne.includes("📍")) {
            section = "details";
          }
          
          if (ligne.includes("Articles") || ligne.includes("🛒") || /^\d+x\s/.test(ligne)) {
            section = "articles";
            if (!ligne.includes("Articles")) {
              parserArticle(ligne, result.articles);
            }
            return;
          }
          
          if (ligne.includes("TOTAL") || ligne.includes("💰") || ligne.includes("Total") ||
              ligne.includes("MAXI-") || /^\d+\.\d{3}\s*(DT|dt|TND)/.test(ligne)) {
            section = "total";
          }

          // Extraction selon la section
          switch(section) {
            case "details":
              if (ligne.includes("Nom:") || ligne.includes("👤")) {
                result.nom = ligne.replace(/Nom:|👤/g, "").trim();
              } else if (ligne.includes("Téléphone:") || ligne.includes("📞") || /\+216/.test(ligne)) {
                result.telephone = ligne.replace(/Téléphone:|📞/g, "").trim();
              } else if (ligne.includes("Adresse:") || ligne.includes("📍")) {
                result.adresse = ligne.replace(/Adresse:|📍/g, "").trim();
              }
              break;
              
            case "articles":
              if (ligne.trim() && !ligne.includes("Articles")) {
                parserArticle(ligne, result.articles);
              }
              break;
              
            case "total":
              if (ligne.includes("MAXI-") || ligne.includes("Commande #")) {
                result.numero_commande = ligne.replace(/Commande #/g, "").trim();
              } else if (ligne.includes("TOTAL") || ligne.includes("💰") || ligne.includes("Total:")) {
                const totalMatch = ligne.match(/(\d+\.?\d*)\s*(DT|dt|TND|tnd)/i);
                if (totalMatch) {
                  result.total = parseFloat(totalMatch[1]);
                }
              }
              break;
          }
        });
      }

      // Générer numéro commande si vide
      if (!result.numero_commande) {
        const now = new Date();
        const dateStr = now.getFullYear().toString() + 
                       (now.getMonth() + 1).toString().padStart(2, '0') + 
                       now.getDate().toString().padStart(2, '0');
        const timeStr = now.getHours().toString().padStart(2, '0') + 
                       now.getMinutes().toString().padStart(2, '0');
        result.numero_commande = `MAXI-${dateStr}-${timeStr}`;
      }

      // Calculer le total si nécessaire
      if (result.total === 0 && result.articles.length > 0) {
        result.total = result.articles.reduce((sum, article) => {
          return sum + (article.prix_total || (article.prix_unitaire || 0) * (article.quantite || 1));
        }, 0);
      }

      return result;
    }

    function parserArticle(ligne, articlesArray) {
      ligne = ligne.trim();
      
      // Format: "2x Produit - 15.500 DT"
      const match1 = ligne.match(/(\d+)\s*x\s*([^-]+)-\s*(\d+\.?\d*)\s*(DT|dt|TND|tnd)?/i);
      if (match1) {
        const prix = parseFloat(match1[3]);
        const quantite = parseInt(match1[1]);
        articlesArray.push({
          produit: match1[2].trim(),
          quantite: quantite,
          prix_unitaire: prix,
          prix_total: quantite * prix
        });
        return;
      }
      
      // Format: "Produit: 15.500 DT x2"
      const match2 = ligne.match(/(.+):\s*(\d+\.?\d*)\s*(DT|dt|TND|tnd)?\s*x\s*(\d+)/i);
      if (match2) {
        const prix = parseFloat(match2[2]);
        const quantite = parseInt(match2[4]);
        articlesArray.push({
          produit: match2[1].trim(),
          quantite: quantite,
          prix_unitaire: prix,
          prix_total: quantite * prix
        });
        return;
      }
      
      // Format simple: "2x Produit"
      const match3 = ligne.match(/(\d+)\s*x\s*(.+)/i);
      if (match3) {
        articlesArray.push({
          produit: match3[2].trim(),
          quantite: parseInt(match3[1]),
          prix_unitaire: 0,
          prix_total: 0
        });
      }
    }

    /**
     * ==========================
     *  AFFICHAGE STRUCTURÉ
     * ==========================
     */
    function afficherSectionsStructurees(commande) {
      const container = document.getElementById("sectionsContainer");

    /**
     * ==========================
     *  VALIDATION ET ENVOI
     * ==========================
     */
    async function validerEtEnvoyerCommande() {
      if (validationInProgress) return;
      
      validationInProgress = true;
      showLoading(true);
      
      try {
        // Mettre à jour les étapes de validation
        updateValidationSteps([
          { status: 'pending', text: 'Vérification des données...' },
          { status: 'pending', text: 'Enregistrement de la commande...' },
          { status: 'pending', text: 'Envoi vers Google Sheets...' },
          { status: 'pending', text: 'Notification WhatsApp...' }
        ]);
        
        // Étape 1: Vérification
        updateValidationStep(0, 'completed', '✅ Données vérifiées');
        
        if (!currentOrder) {
          throw new Error("Aucune commande à valider");
        }
        
        // Étape 2: Préparer la commande
        currentOrder.statut = "Validée";
        currentOrder.date_validation = new Date().toISOString();
        
        // Sauvegarder localement
        sauvegarderCommandeLocale(currentOrder);
        updateValidationStep(1, 'completed', '✅ Commande enregistrée localement');
        
        // Étape 3: Envoyer vers Google Sheets
        const sheetsResult = await envoyerVersGoogleSheets(currentOrder);
        
        if (sheetsResult.success) {
          updateValidationStep(2, 'completed', '✅ Google Sheets mis à jour');
        } else {
          updateValidationStep(2, 'error', '⚠️ Google Sheets: ' + (sheetsResult.error || 'Erreur'));
          // Continuer même si Google Sheets échoue
        }
        
        // Étape 4: Envoyer notification WhatsApp
        await envoyerNotificationWhatsApp(currentOrder);
        updateValidationStep(3, 'completed', '✅ WhatsApp envoyé');
        
        // Mettre à jour l'affichage
        afficherSectionsStructurees(currentOrder);
        
        // Jouer le son de notification
        playTabletSound();
        
        // Afficher message de succès
        showToast("✅ Commande validée et envoyée avec succès !", "ok");
        
        // Réinitialiser après 3 secondes
        setTimeout(() => {
          updateValidationSteps([
            { status: 'completed', text: 'Commande terminée avec succès !' }
          ]);
        }, 3000);
        
      } catch (error) {
        console.error("Erreur validation:", error);
        showToast("❌ Erreur: " + error.message, "err");
        
        updateValidationSteps([
          { status: 'error', text: '❌ Erreur: ' + error.message }
        ]);
        
      } finally {
        showLoading(false);
        validationInProgress = false;
      }
    }

    /**
     * ==========================
     *  GOOGLE SHEETS INTEGRATION
     * ==========================
     */
    async function envoyerVersGoogleSheets(commande) {
      try {
        // Préparer les données
        const data = {
          commande_id: commande.numero_commande,
          nom: commande.nom || '',
          telephone: commande.telephone || '',
          adresse: commande.adresse || '',
          articles: JSON.stringify(commande.articles || []),
          total: commande.total ? commande.total.toFixed(3) : '0.000',
          statut: commande.statut || 'En attente',
          date: new Date().toISOString(),
          action: 'saveOrder'
        };

        // Essayer plusieurs méthodes
        const methods = [
          () => envoyerAvecFetch(data),
          () => envoyerAvecXHR(data),
          () => envoyerAvecJSONP(data)
        ];

        for (let method of methods) {
          try {
            const result = await method();
            if (result) {
              return { success: true, method: method.name };
            }
          } catch (e) {
            console.warn(`Méthode ${method.name} échouée:`, e);
          }
        }

        return { 
          success: false, 
          error: "Toutes les méthodes ont échoué" 
        };

      } catch (error) {
        return { 
          success: false, 
          error: error.message 
        };
      }
    }

    // Méthode 1: Fetch avec mode no-cors
    function envoyerAvecFetch(data) {
      return new Promise((resolve) => {
        const formData = new URLSearchParams();
        for (const key in data) {
          formData.append(key, data[key]);
        }

        fetch(API_BASE_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: formData.toString()
        })
        .then(() => resolve(true))
        .catch(() => resolve(false));
      });
    }

    // Méthode 2: XMLHttpRequest (plus compatible)
    function envoyerAvecXHR(data) {
      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        const formData = new URLSearchParams();
        
        for (const key in data) {
          formData.append(key, data[key]);
        }

        xhr.open('POST', API_BASE_URL, true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        
        xhr.onload = function() {
          if (xhr.status === 200 || xhr.status === 0) {
            resolve(true);
          } else {
            resolve(false);
          }
        };
        
        xhr.onerror = function() {
          resolve(false);
        };
        
        xhr.send(formData.toString());
      });
    }

    // Méthode 3: JSONP (contournement CORS)
    function envoyerAvecJSONP(data) {
      return new Promise((resolve) => {
        const callbackName = 'callback_' + Date.now();
        
        window[callbackName] = function(response) {
          resolve(true);
          delete window[callbackName];
        };

        const params = new URLSearchParams(data);
        params.append('callback', callbackName);
        
        const script = document.createElement('script');
        script.src = `${API_BASE_URL}?${params.toString()}`;
        
        script.onerror = () => {
          resolve(false);
          document.head.removeChild(script);
          delete window[callbackName];
        };
        
        document.head.appendChild(script);
        
        // Timeout
        setTimeout(() => {
          if (window[callbackName]) {
            resolve(false);
            document.head.removeChild(script);
            delete window[callbackName];
          }
        }, 5000);
      });
    }

    /**
     * ==========================
     *  WHATSAPP NOTIFICATION
     * ==========================
     */
    function envoyerNotificationWhatsApp(commande) {
      try {
        const phone = WHATSAPP_NUMBER.replace(/\D/g, '');
        
        let message = `🛒 NOUVELLE COMMANDE VALIDÉE\n\n`;
        message += `📋 N°: ${commande.numero_commande}\n`;
        message += `👤 Client: ${commande.nom}\n`;
        message += `📞 Tel: ${commande.telephone}\n`;
        message += `📍 Adresse: ${commande.adresse}\n`;
        message += `💰 Total: ${commande.total ? commande.total.toFixed(3) + ' DT' : '0.000 DT'}\n`;
        message += `📦 Articles: ${commande.articles ? commande.articles.length : 0}\n`;
        message += `⏰ Date: ${new Date().toLocaleString('fr-FR')}\n`;
        message += `📊 Statut: ${commande.statut}\n\n`;
        message += `ARTICLES:\n`;
        
        if (commande.articles && commande.articles.length > 0) {
          commande.articles.forEach((article, index) => {
            message += `${index + 1}. ${article.quantite}x ${article.produit || article.name}`;
            if (article.prix_unitaire) {
              message += ` (${article.prix_unitaire.toFixed(3)} DT)`;
            }
            message += `\n`;
          });
        }
        
        message += `\n✅ PRÊT POUR LA PRÉPARATION`;
        
        const encoded = encodeURIComponent(message);
        window.open(`https://wa.me/${phone}?text=${encoded}`, '_blank');
        
        return true;
      } catch (error) {
        console.error("Erreur WhatsApp:", error);
        return false;
      }
    }

    /**
     * ==========================
     *  SAUVEGARDE LOCALE
     * ==========================
     */
    function sauvegarderCommandeLocale(commande) {
      try {
        // Sauvegarder dans localStorage
        const commandes = JSON.parse(localStorage.getItem('maxi_commandes_validees') || '[]');
        
        const commandeComplete = {
          ...commande,
          saved_at: new Date().toISOString(),
          saved_locally: true
        };
        
        commandes.unshift(commandeComplete); // Ajouter au début
        
        // Garder seulement les 100 dernières commandes
        localStorage.setItem('maxi_commandes_validees', 
          JSON.stringify(commandes.slice(0, 100)));
        
        // Sauvegarder aussi la dernière commande
        localStorage.setItem('maxi_derniere_commande', 
          JSON.stringify(commandeComplete));
        
        return true;
      } catch (error) {
        console.error("Erreur sauvegarde locale:", error);
        return false;
      }
    }

    /**
     * ==========================
     *  UTILITAIRES
     * ==========================
     */
    function showToast(text, type = "ok") {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.className = "toast show " + type;
      setTimeout(() => el.className = "toast", 3200);
    }

    function playTabletSound() {
      try {
        document.getElementById("soundAlert").classList.add("show");
        setTimeout(() => {
          document.getElementById("soundAlert").classList.remove("show");
        }, 5000);
      } catch (error) {
        console.warn("Son non supporté:", error);
      }
    }

    function showLoading(show) {
      document.getElementById("loadingOverlay").style.display = 
        show ? "flex" : "none";
    }

    function updateValidationSteps(steps) {
      const container = document.getElementById("validationSteps");
      let html = '';
      
      steps.forEach(step => {
        html += `
          <div class="step ${step.status}">
            <i class="fas ${
              step.status === 'completed' ? 'fa-check-circle' :
              step.status === 'error' ? 'fa-exclamation-circle' :
              'fa-circle-notch fa-spin'
            }"></i>
            <span>${step.text}</span>
          </div>
        `;
      });
      
      container.innerHTML = html;
    }

    function updateValidationStep(index, status, text) {
      const steps = document.querySelectorAll('.validation-steps .step');
      if (steps[index]) {
        steps[index].className = `step ${status}`;
        const icon = steps[index].querySelector('i');
        const textSpan = steps[index].querySelector('span');
        
        if (icon) {
          icon.className = `fas ${
            status === 'completed' ? 'fa-check-circle' :
            status === 'error' ? 'fa-exclamation-circle' :
            'fa-circle-notch fa-spin'
          }`;
        }
        
        if (textSpan) {
          textSpan.textContent = text;
        }
      }
    }

    function changerStatut(nouveauStatut) {
      if (!currentOrder) return;
      
      currentOrder.statut = nouveauStatut;
      afficherSectionsStructurees(currentOrder);
      
      // Envoyer la mise à jour
      envoyerVersGoogleSheets(currentOrder).then(result => {
        if (result.success) {
          showToast(`✅ Statut changé en "${nouveauStatut}"`, "ok");
        } else {
          showToast("⚠️ Statut changé localement seulement", "ok");
        }
      });
      
      // Sauvegarder localement
      sauvegarderCommandeLocale(currentOrder);
    }

    function downloadText(filename, text) {
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        URL.revokeObjectURL(a.href);
        a.remove();
      }, 0);
    }

    function ouvrirWhatsAppClient() {
      if (!currentOrder || !currentOrder.telephone) {
        showToast("❌ Numéro client manquant", "err");
        return;
      }
      
      const phone = currentOrder.telephone.replace(/\D/g, '');
      const tnPhone = phone.length === 8 ? "216" + phone : 
                     phone.startsWith("216") ? phone : "216" + phone;
      
      const message = `Bonjour ${currentOrder.nom || ''},\n\n` +
                     `Votre commande ${currentOrder.numero_commande} a été reçue.\n` +
                     `Statut: ${currentOrder.statut}\n` +
                     `Total: ${currentOrder.total ? currentOrder.total.toFixed(3) + ' DT' : '0.000 DT'}\n\n` +
                     `Merci pour votre confiance !\nMAXI JDC MARKET`;
      
      window.open(`https://wa.me/${tnPhone}?text=${encodeURIComponent(message)}`, "_blank");
    }

    /**
     * ==========================
     *  INITIALISATION
     * ==========================
     */
    function getDonneesCommande() {
      // 1. Vérifier l'URL
      const params = new URLSearchParams(location.search);
      const urlData = params.get("data") || params.get("commande") || 
                     params.get("order") || "";
      
      if (urlData) {
        return analyserDonneesCommande(urlData);
      }
      
      // 2. Vérifier localStorage
      try {
        const saved = localStorage.getItem("maxi_commande_en_cours") ||
                     localStorage.getItem("maxi_derniere_commande");
        
        if (saved) {
          const parsed = JSON.parse(saved);
          // S'assurer que c'est un objet valide
          if (parsed && typeof parsed === 'object') {
            return analyserDonneesCommande(parsed);
          }
        }
      } catch (e) {
        console.warn("Erreur lecture localStorage:", e);
      }
      
      // 3. Données de démonstration
      const demoData = {
        nom: "Client Démonstration",
        telephone: "+216 12 345 678",
        adresse: "Jardins de Carthage, Tunis",
        articles: [
          { produit: "Produit A", quantite: 2, prix_unitaire: 15.500 },
          { produit: "Produit B", quantite: 1, prix_unitaire: 25.000 },
          { produit: "Produit C", quantite: 3, prix_unitaire: 8.500 }
        ],
        total: 87.500,
        statut: "En attente"
      };
      
      return analyserDonneesCommande(demoData);
    }

    // Initialiser la page
    document.addEventListener("DOMContentLoaded", () => {
      const commande = getDonneesCommande();
      
      // Afficher les données structurées
      afficherSectionsStructurees(commande);
      
      // Vérifier si nouvelle commande
      const isNew = new URLSearchParams(location.search).get("new") === "true";
      if (isNew) {
        setTimeout(() => {
          playTabletSound();
          showToast("🎉 Nouvelle commande reçue !", "ok");
        }, 1000);
      }
      
      // Initialiser les étapes de validation
      updateValidationSteps([
        { status: 'pending', text: 'Prêt à valider la commande...' }
      ]);
    });

    // Événements des boutons
    document.getElementById("validateSendBtn").addEventListener("click", validerEtEnvoyerCommande);

    document.getElementById("downloadBtn").addEventListener("click", () => {
      if (!currentOrder) return;
      
      const text = `COMMANDE MAXI JDC MARKET\n\n` +
                  `N°: ${currentOrder.numero_commande}\n` +
                  `Date: ${new Date().toLocaleString('fr-FR')}\n` +
                  `Client: ${currentOrder.nom}\n` +
                  `Téléphone: ${currentOrder.telephone}\n` +
                  `Adresse: ${currentOrder.adresse}\n` +
                  `Total: ${currentOrder.total ? currentOrder.total.toFixed(3) + ' DT' : '0.000 DT'}\n` +
                  `Statut: ${currentOrder.statut}\n\n` +
                  `Articles:\n${currentOrder.articles ? 
                    currentOrder.articles.map(a => 
                      `${a.quantite}x ${a.produit || a.name} - ${a.prix_unitaire ? a.prix_unitaire.toFixed(3) + ' DT' : '—'}`
                    ).join('\n') : 'Aucun'}`;
      
      downloadText(`commande-${currentOrder.numero_commande}.txt`, text);
      showToast("📥 Commande téléchargée", "ok");
    });

    document.getElementById("whatsappBtn").addEventListener("click", ouvrirWhatsAppClient);

    document.getElementById("cancelBtn").addEventListener("click", () => {
      if (confirm("Êtes-vous sûr de vouloir annuler cette commande ?")) {
        changerStatut("Annulée");
        showToast("❌ Commande annulée", "err");
        
        setTimeout(() => {
          if (window.opener) {
            window.close();
          }
        }, 2000);
      }
    });

    document.getElementById("closeBtn").addEventListener("click", () => {
      window.close();
    });

    // Raccourcis clavier
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") document.getElementById("closeBtn").click();
      if (e.ctrlKey && e.key === "Enter") {
        e.preventDefault();
        validerEtEnvoyerCommande();
      }
      if (e.ctrlKey && e.key === "s") {
        e.preventDefault();
        document.getElementById("downloadBtn").click();
      }
      if (e.ctrlKey && e.key === "w") {
        e.preventDefault();
        document.getElementById("whatsappBtn").click();
      }
    });
  </script>
