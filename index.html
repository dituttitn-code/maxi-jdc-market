<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MAXI JDC MARKET</title>

  <!-- Leaflet (si tu veux la carte plus tard, on le garde) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root{
      --bg:#050708;
      --card:#0d1418;
      --muted:#9fb0bb;
      --txt:#e8f0f5;
      --accent:#14d38a;
      --accent2:#00b3ff;
      --danger:#ff4d4d;
      --warn:#ffb020;
      --shadow: 0 12px 40px rgba(0,0,0,.55);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 700px at 50% -10%, rgba(20,211,138,.22), transparent 55%),
                  radial-gradient(900px 500px at 10% 10%, rgba(0,179,255,.18), transparent 55%),
                  var(--bg);
      color:var(--txt);
    }
    a{color:inherit; text-decoration:none}
    .topbar{
      position:sticky; top:0; z-index:20;
      backdrop-filter: blur(10px);
      background: rgba(5,7,8,.62);
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 14px 14px;
    }
    .topbar-inner{
      max-width: 1200px; margin:0 auto;
      display:flex; gap:12px; align-items:center; justify-content:space-between;
    }
    .brand{
      display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.3px;
    }
    .logo{
      width:38px;height:38px;border-radius:12px;
      background: linear-gradient(135deg, rgba(20,211,138,.95), rgba(0,179,255,.85));
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .search{
      flex:1; max-width: 620px;
      display:flex; align-items:center; gap:10px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      padding: 10px 12px;
    }
    .search input{
      width:100%; border:0; outline:0; background:transparent;
      color:var(--txt); font-size: 15px;
    }
    .pill{
      display:flex; align-items:center; gap:8px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      cursor:pointer;
      transition: .15s;
      user-select:none;
    }
    .pill:hover{transform: translateY(-1px); border-color: rgba(255,255,255,.18)}
    .pill .badge{
      min-width: 22px; height: 22px; border-radius: 999px;
      display:grid; place-items:center;
      background: rgba(20,211,138,.20);
      border: 1px solid rgba(20,211,138,.45);
      color: var(--accent);
      font-weight: 800;
      font-size: 12px;
      padding: 0 7px;
    }

    .layout{
      max-width: 1200px; margin: 18px auto 90px;
      padding: 0 14px;
      display:grid;
      grid-template-columns: 260px 1fr;
      gap: 14px;
    }
    @media(max-width: 980px){
      .layout{grid-template-columns: 1fr}
      .sidebar{order:2}
    }

    .sidebar{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      position: sticky; top: 86px;
      height: fit-content;
    }
    .side-title{font-weight:800; margin: 6px 0 10px}
    .catlist{display:flex; flex-direction:column; gap:8px}
    .catbtn{
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      cursor:pointer;
      transition: .15s;
      display:flex; justify-content:space-between; align-items:center;
      gap:8px;
    }
    .catbtn:hover{transform: translateY(-1px); border-color: rgba(255,255,255,.18)}
    .catbtn.active{
      border-color: rgba(20,211,138,.55);
      box-shadow: 0 0 0 3px rgba(20,211,138,.10) inset;
    }
    .catcount{
      color: var(--muted);
      font-size: 12px;
    }

    .content{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      min-height: 520px;
    }
    .toolbar{
      display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
      margin-bottom: 12px;
    }
    .toolbar .hint{color: var(--muted); font-size: 13px}
    .grid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    @media(max-width: 1100px){ .grid{grid-template-columns: repeat(3, 1fr)} }
    @media(max-width: 760px){ .grid{grid-template-columns: repeat(2, 1fr)} }
    @media(max-width: 420px){ .grid{grid-template-columns: 1fr} }

    .card{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      border-radius: 18px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height: 250px;
      transition: .15s;
    }
    .card:hover{transform: translateY(-2px); border-color: rgba(255,255,255,.18)}
    .img{
      width:100%; aspect-ratio: 4/3;
      background: rgba(255,255,255,.04);
      position:relative;
      overflow:hidden;
      display:grid; place-items:center;
    }
    .img img{width:100%; height:100%; object-fit:cover; display:block}
    .promoTag{
      position:absolute; top:10px; left:10px;
      background: rgba(255,77,77,.18);
      border: 1px solid rgba(255,77,77,.55);
      color: #ffb3b3;
      font-weight:800;
      font-size: 12px;
      padding: 5px 9px;
      border-radius: 999px;
    }
    .stockTag{
      position:absolute; top:10px; right:10px;
      background: rgba(0,179,255,.15);
      border: 1px solid rgba(0,179,255,.45);
      color: #bdeaff;
      font-weight:800;
      font-size: 12px;
      padding: 5px 9px;
      border-radius: 999px;
    }
    .body{
      padding: 12px;
      display:flex; flex-direction:column; gap:8px;
      flex:1;
    }
    .name{font-weight:800; line-height:1.2; min-height: 38px}
    .meta{display:flex; justify-content:space-between; align-items:center; gap:10px}
    .price{font-weight:900}
    .old{color: var(--muted); text-decoration: line-through; font-weight:700; font-size: 12px}
    .btn{
      width:100%;
      border:1px solid rgba(20,211,138,.45);
      background: rgba(20,211,138,.12);
      color: var(--accent);
      border-radius: 14px;
      padding: 10px 12px;
      cursor:pointer;
      font-weight:900;
      transition: .15s;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(20,211,138,.18)}
    .btn:disabled{
      opacity:.45; cursor:not-allowed; transform:none;
    }

    /* Drawer panier */
    .drawer{
      position:fixed; inset:0; z-index:50;
      display:none;
      background: rgba(0,0,0,.55);
    }
    .drawer.open{display:block}
    .drawer-panel{
      position:absolute; right:0; top:0; height:100%;
      width:min(420px, 100%);
      background: rgba(10,14,16,.98);
      border-left: 1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
      padding: 14px;
      display:flex; flex-direction:column;
    }
    .drawer-head{display:flex; justify-content:space-between; align-items:center; gap:12px}
    .drawer-head h3{margin:0}
    .closeX{
      width:40px;height:40px;border-radius: 14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:var(--txt); cursor:pointer;
      font-size: 22px;
    }
    .cartlist{
      margin-top: 12px;
      display:flex; flex-direction:column; gap:10px;
      overflow:auto;
      padding-right: 6px;
      flex:1;
    }
    .cartitem{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      border-radius: 16px;
      padding: 10px;
      display:grid;
      grid-template-columns: 1fr auto;
      gap:10px;
      align-items:center;
    }
    .cartitem .t{font-weight:800}
    .qty{
      display:flex; gap:8px; align-items:center;
      justify-content:flex-end;
    }
    .qty button{
      width:34px;height:34px;border-radius: 12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--txt);
      cursor:pointer;
      font-weight:900;
    }
    .qty span{min-width: 26px; text-align:center; font-weight:900}
    .sum{
      border-top: 1px solid rgba(255,255,255,.10);
      padding-top: 12px;
      display:flex; flex-direction:column; gap:8px;
    }
    .row{display:flex; justify-content:space-between; color: var(--muted)}
    .row strong{color:var(--txt)}
    .primary{
      border:1px solid rgba(0,179,255,.45);
      background: rgba(0,179,255,.12);
      color: #bdeaff;
    }
    .danger{
      border:1px solid rgba(255,77,77,.55);
      background: rgba(255,77,77,.12);
      color: #ffb3b3;
    }

    /* Modal commande */
    .modal{
      position:fixed; inset:0; z-index:60;
      display:none;
      background: rgba(0,0,0,.55);
      padding: 18px;
    }
    .modal.open{display:grid; place-items:center}
    .modal-card{
      width:min(760px, 100%);
      background: rgba(10,14,16,.98);
      border:1px solid rgba(255,255,255,.10);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .modal-head{
      padding: 12px 14px;
      display:flex; justify-content:space-between; align-items:center; gap:12px;
      border-bottom: 1px solid rgba(255,255,255,.10);
    }
    .modal-head h3{margin:0}
    .modal-body{padding: 14px}
    pre{
      margin:0;
      white-space:pre-wrap;
      word-break:break-word;
      background: rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      padding: 12px;
      max-height: 360px;
      overflow:auto;
      color: #e8f0f5;
    }
    .modal-foot{
      display:flex; gap:10px; flex-wrap:wrap;
      padding: 12px 14px;
      border-top: 1px solid rgba(255,255,255,.10);
    }
    .smallbtn{
      flex:1;
      min-width: 140px;
      padding: 11px 12px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--txt);
      font-weight:900;
      cursor:pointer;
    }
    .smallbtn.green{border-color: rgba(20,211,138,.45); background: rgba(20,211,138,.12); color: var(--accent)}
    .smallbtn.blue{border-color: rgba(0,179,255,.45); background: rgba(0,179,255,.12); color: #bdeaff}

    /* Toast */
    .toastwrap{
      position: fixed; right: 16px; top: 90px; z-index:80;
      display:flex; flex-direction:column; gap:10px;
    }
    .toast{
      width: min(360px, calc(100vw - 32px));
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(14,20,24,.96);
      box-shadow: var(--shadow);
      padding: 12px 14px;
      display:flex; align-items:flex-start; gap:10px;
    }
    .toast .title{font-weight:900}
    .toast .msg{color: var(--muted); font-size: 13px}
    .toast.ok{border-color: rgba(20,211,138,.45)}
    .toast.warn{border-color: rgba(255,176,32,.55)}
    .toast.err{border-color: rgba(255,77,77,.55)}
    .toast .x{
      margin-left:auto;
      width: 34px; height: 34px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--txt);
      cursor:pointer;
      font-size: 18px;
    }

    /* Loader */
    .center{
      display:grid; place-items:center;
      padding: 60px 10px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <div style="font-size:14px; color:var(--muted); font-weight:700;">Application</div>
          <div style="font-size:18px;">MAXI JDC MARKET</div>
        </div>
      </div>

      <div class="search">
        🔎 <input id="searchInput" placeholder="Rechercher un produit (nom, code)..." autocomplete="off"/>
      </div>

      <div class="pill" id="cartBtn" title="Ouvrir le panier">
        🛒 Panier <span class="badge" id="cartCount">0</span>
      </div>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-title">Catégories</div>
      <div class="catlist" id="catList"></div>
      <div style="margin-top:12px; color:var(--muted); font-size:12px; line-height:1.4;">
        Min commande: <b id="minOrderTxt"></b><br/>
        Livraison gratuite dès: <b id="freeShipTxt"></b><br/>
        Frais livraison: <b id="shipFeeTxt"></b>
      </div>
    </aside>

    <main class="content">
      <div class="toolbar">
        <div class="hint" id="statusLine">Chargement…</div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <div class="pill" id="refreshBtn">🔄 Rafraîchir</div>
        </div>
      </div>

      <div id="productArea">
        <div class="center">Chargement des produits…</div>
      </div>
    </main>
  </div>

  <!-- Drawer panier -->
  <div class="drawer" id="cartDrawer">
    <div class="drawer-panel">
      <div class="drawer-head">
        <h3>🛒 Votre panier</h3>
        <button class="closeX" id="closeCartBtn">×</button>
      </div>

      <div class="cartlist" id="cartList"></div>

      <div class="sum">
        <div class="row"><span>Sous-total</span><strong id="subTotalTxt">0.000</strong></div>
        <div class="row"><span>Livraison</span><strong id="shipTxt">0.000</strong></div>
        <div class="row" style="color:var(--txt)"><span>Total</span><strong id="totalTxt">0.000</strong></div>

        <button class="btn primary" id="placeOrderBtn">✅ Commander</button>
        <button class="btn danger" id="clearCartBtn">🧹 Vider panier</button>
      </div>
    </div>
  </div>

  <!-- Modal commande -->
  <div class="modal" id="orderModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3>✅ Commande confirmée</h3>
        <button class="closeX" id="closeOrderModalBtn">×</button>
      </div>
      <div class="modal-body">
        <pre id="orderDetails"></pre>
      </div>
      <div class="modal-foot">
        <button class="smallbtn" id="copyOrderBtn">📋 Copier</button>
        <button class="smallbtn blue" id="downloadOrderBtn">💾 Télécharger</button>
        <button class="smallbtn green" id="whatsappOrderBtn">📱 WhatsApp</button>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toastwrap" id="toastWrap"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
  /************************************************************
   * CONFIG (TONS LIENS / PARAMS)
   ************************************************************/
  const CONFIG = {
    minOrder: 15,
    freeShipping: 100,
    shippingFee: 3,
    whatsappNumber: "21625600978",

    itemsPerPage: 24,
    localStorageKey: "maxi_jdc_market_app_v33",
    imagesBasePath: "images/products/",
    historyRetentionYears: 2,

    // Stock depuis Google Sheets publié en CSV (si tu l’utilises)
    googleSheetsUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTd3iOI9ehmZmPWcn9z7BKU7hsf3K33LjaBISm9_Y-bk_Zrj146jShFjxCjnpwrEgUJiELpX3BDV2Bl/pub?gid=0&single=true&output=csv",

    // ✅ TON Apps Script (OK chez toi)
    commandeApiUrl: "https://script.google.com/macros/s/AKfycbwupA9X-fbIwK1t1bHR0L3_xgefj9wWsPcXyAd0E34aRSJjVYovu7C2R-vugXMmz0zK/exec",
  };

  // Catégories (tes CSV locaux)
  const CATEGORIES = [
    { key:"promotions", label:"🔥 PROMOTIONS", file:"data/PROMOTIONS.csv", isPromo:true },
    { key:"cafe", label:"☕ Café & Thés", file:"data/cafe.csv" },
    { key:"animaux_compagnie", label:"🐶 Animaux de Compagnie", file:"data/animaux_compagnie.csv" },
    { key:"bebe_maman", label:"👶 Bébé & Maman", file:"data/bebe_maman.csv" },
    { key:"boulangerie_patisserie", label:"🥖 Boulangerie & Pâtisserie", file:"data/boulangerie_patisserie.csv" },
    { key:"chips_snacks", label:"🥔 Chips & Snacks", file:"data/chips_snacks.csv" },
    { key:"chocolats_biscuits", label:"🍫 Chocolats & Biscuits", file:"data/chocolats_biscuits.csv" },
    { key:"conserves", label:"🥫 Conserves & Bocaux", file:"data/conserves.csv" },
    { key:"cuisine_monde", label:"🌍 Cuisine du Monde", file:"data/cuisine_monde.csv" },
    { key:"eaux", label:"💧 Eaux & Boissons", file:"data/eaux.csv" },
    { key:"epicerie_salee", label:"🧂 Épicerie Salée", file:"data/epicerie_salee.csv" },
    { key:"epicerie_sucree", label:"🍬 Épicerie Sucrée", file:"data/epicerie_sucree.csv" },
    { key:"fromage_charcuterie", label:"🧀 Fromages & Charcuteries", file:"data/fromage_charcuterie.csv" },
    { key:"fruits_legumes", label:"🍎 Fruits & Légumes", file:"data/fruits_legumes.csv" },
    { key:"fruits_secs_noix", label:"🌰 Fruits Secs & Noix", file:"data/fruits_secs_noix.csv" },
    { key:"hygiene_entretien", label:"🧼 Hygiène & Entretien", file:"data/hygiene_entretien.csv" },
    { key:"hygiene_soins", label:"🧴 Soins & Beauté", file:"data/hygiene_soins.csv" },
  ];

  /************************************************************
   * STATE
   ************************************************************/
  const state = {
    category: CATEGORIES[0].key,
    productsByCat: new Map(),     // catKey -> product[]
    allProducts: [],              // flattened for search
    cart: {},                     // code -> {code,name,price,oldPrice,isPromotion,quantity,image,stock}
    user: { name:"", phone:"", address:"", lat:null, lng:null },
    stockMap: new Map(),          // code -> stock
    lastOrderText: "",
  };

  /************************************************************
   * HELPERS
   ************************************************************/
  const $ = (id) => document.getElementById(id);

  function money(n){
    const x = Number(n || 0);
    return x.toFixed(3);
  }

  function showToast(title, message="", type="ok"){
    const wrap = $("toastWrap");
    const el = document.createElement("div");
    el.className = "toast " + (type === "ok" ? "ok" : type === "warn" ? "warn" : "err");
    el.innerHTML = `
      <div>
        <div class="title">${escapeHtml(title)}</div>
        ${message ? `<div class="msg">${escapeHtml(message)}</div>` : ``}
      </div>
      <button class="x" aria-label="Fermer">×</button>
    `;
    el.querySelector(".x").onclick = () => el.remove();
    wrap.appendChild(el);
    setTimeout(() => { if (el && el.parentNode) el.remove(); }, 4200);
  }

  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function saveState(){
    const payload = {
      cart: state.cart,
      user: state.user,
      version: "33.0"
    };
    localStorage.setItem(CONFIG.localStorageKey, JSON.stringify(payload));
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(CONFIG.localStorageKey);
      if(!raw) return;
      const obj = JSON.parse(raw);
      if(obj && typeof obj === "object"){
        state.cart = obj.cart || {};
        state.user = obj.user || state.user;
      }
    }catch(e){}
  }

  /************************************************************
   * CSV
   ************************************************************/
  function parseCSV(text){
    // simple CSV parser (works for your typical sheets export)
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
    if(!lines.length) return [];
    const headers = splitCSVLine(lines[0]).map(h => h.trim());
    const out = [];
    for(let i=1;i<lines.length;i++){
      const cols = splitCSVLine(lines[i]);
      const row = {};
      headers.forEach((h,idx) => row[h] = (cols[idx] ?? "").trim());
      out.push(row);
    }
    return out;
  }

  function splitCSVLine(line){
    const res = [];
    let cur = "";
    let inQ = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(ch === '"' ){
        if(inQ && line[i+1] === '"'){ cur += '"'; i++; }
        else inQ = !inQ;
      } else if(ch === "," && !inQ){
        res.push(cur); cur = "";
      } else {
        cur += ch;
      }
    }
    res.push(cur);
    return res;
  }

  function normalizePrice(v){
    if(v === null || v === undefined) return 0;
    const s = String(v).replace(",", ".").replace(/[^\d.]/g, "");
    const n = Number(s);
    return isNaN(n) ? 0 : n;
  }

  function guessCode(row){
    return String(row.code ?? row.CODE ?? row.id ?? row.ID ?? row.sku ?? row.SKU ?? "").trim();
  }

  function guessName(row){
    return String(row.nom ?? row.name ?? row.designation ?? row.produit ?? row.Produit ?? row.PRODUIT ?? "").trim();
  }

  function guessPrice(row){
    return normalizePrice(row.prix ?? row.price ?? row.PRIX ?? row.Prix ?? row["prix_ttc"] ?? row["PU"] ?? 0);
  }

  function guessOldPrice(row){
    const op = row.ancien_prix ?? row.oldPrice ?? row["ancien prix"] ?? row["old_price"];
    const n = normalizePrice(op);
    return n > 0 ? n : null;
  }

  function guessImage(row, code){
    const img = String(row.image ?? row.img ?? row.photo ?? "").trim();
    if(img) return img;
    if(code) return CONFIG.imagesBasePath + encodeURIComponent(code) + ".jpg";
    return "";
  }

  /************************************************************
   * JSONP (FIX FINAL)
   ************************************************************/
  function fetchJsonp(url, { timeout = 12000 } = {}) {
    return new Promise((resolve, reject) => {
      const cbName = "__jsonp_cb_" + Math.random().toString(36).slice(2);
      const sep = url.includes("?") ? "&" : "?";
      const finalUrl = url + sep + "callback=" + cbName;

      const script = document.createElement("script");
      let timer = null;

      window[cbName] = (data) => {
        cleanup();
        resolve(data);
      };

      function cleanup() {
        if (timer) clearTimeout(timer);
        try { delete window[cbName]; } catch(e){ window[cbName] = undefined; }
        if (script && script.parentNode) script.parentNode.removeChild(script);
      }

      timer = setTimeout(() => {
        cleanup();
        reject(new Error("JSONP timeout"));
      }, timeout);

      script.onerror = () => {
        cleanup();
        reject(new Error("JSONP script load error"));
      };

      script.src = finalUrl;
      document.body.appendChild(script);
    });
  }

  /************************************************************
   * LOAD STOCK (OPTIONNEL)
   ************************************************************/
  async function loadGoogleSheetsStock(){
    // Si ton googleSheetsUrl contient stock par code, on le lit.
    // Colonnes acceptées: code / CODE / id + stock / STOCK / qty
    try{
      if(!CONFIG.googleSheetsUrl) return;
      const r = await fetch(CONFIG.googleSheetsUrl, { cache:"no-store" });
      if(!r.ok) return;
      const text = await r.text();
      const rows = parseCSV(text);
      const m = new Map();
      for(const row of rows){
        const code = guessCode(row);
        if(!code) continue;
        const st = Number(String(row.stock ?? row.STOCK ?? row.qty ?? row.QTY ?? "").replace(",", "."));
        if(!isNaN(st)) m.set(code, st);
      }
      state.stockMap = m;
    }catch(e){
      // stock non bloquant
      console.warn("Stock GS non chargé:", e);
    }
  }

  /************************************************************
   * LOAD PRODUCTS
   ************************************************************/
  async function loadCategory(cat){
    const res = await fetch(cat.file, { cache:"no-store" });
    if(!res.ok) throw new Error("CSV introuvable: " + cat.file);
    const text = await res.text();
    const rows = parseCSV(text);

    const products = rows.map((row) => {
      const code = guessCode(row);
      const name = guessName(row);
      const price = guessPrice(row);
      const oldPrice = guessOldPrice(row);
      const image = guessImage(row, code);
      const isPromotion = !!cat.isPromo || (oldPrice && oldPrice > price);

      const stock = (code && state.stockMap.has(code)) ? state.stockMap.get(code) : null;

      return {
        code, name, price,
        oldPrice,
        image,
        categoryKey: cat.key,
        categoryLabel: cat.label,
        isPromotion,
        stock
      };
    }).filter(p => p.name && p.price > 0);

    return products;
  }

  async function loadAllProducts(){
    $("statusLine").textContent = "Chargement des stocks…";
    await loadGoogleSheetsStock();

    $("statusLine").textContent = "Chargement des produits…";
    state.productsByCat.clear();
    state.allProducts = [];

    const counts = new Map();

    for(const cat of CATEGORIES){
      try{
        const items = await loadCategory(cat);
        state.productsByCat.set(cat.key, items);
        state.allProducts.push(...items);
        counts.set(cat.key, items.length);
      }catch(e){
        console.error(e);
        state.productsByCat.set(cat.key, []);
        counts.set(cat.key, 0);
      }
    }

    renderCategories(counts);
    renderProducts();
    $("statusLine").textContent = `✅ ${state.allProducts.length} produits chargés`;
  }

  function renderCategories(counts){
    const wrap = $("catList");
    wrap.innerHTML = "";
    for(const cat of CATEGORIES){
      const btn = document.createElement("div");
      btn.className = "catbtn" + (state.category === cat.key ? " active" : "");
      btn.innerHTML = `
        <span>${escapeHtml(cat.label)}</span>
        <span class="catcount">${counts.get(cat.key) ?? 0}</span>
      `;
      btn.onclick = () => {
        state.category = cat.key;
        renderCategories(counts);
        renderProducts();
      };
      wrap.appendChild(btn);
    }
  }

  function getVisibleProducts(){
    const q = $("searchInput").value.trim().toLowerCase();
    let list = state.productsByCat.get(state.category) || [];
    if(q){
      list = state.allProducts.filter(p => (
        p.name.toLowerCase().includes(q) ||
        (p.code && p.code.toLowerCase().includes(q))
      ));
    }
    return list;
  }

  function renderProducts(){
    const area = $("productArea");
    const list = getVisibleProducts();

    if(!list.length){
      area.innerHTML = `<div class="center">Aucun produit trouvé.</div>`;
      return;
    }

    const grid = document.createElement("div");
    grid.className = "grid";

    list.slice(0, 2000).forEach(p => {
      const card = document.createElement("div");
      card.className = "card";

      const stockLabel = (p.stock === null || p.stock === undefined) ? "" :
                         (p.stock <= 0 ? "Rupture" : "Stock: " + p.stock);

      const disabled = (p.stock !== null && p.stock !== undefined && p.stock <= 0);

      card.innerHTML = `
        <div class="img">
          ${p.isPromotion ? `<div class="promoTag">PROMO</div>` : ``}
          ${stockLabel ? `<div class="stockTag">${escapeHtml(stockLabel)}</div>` : ``}
          <img alt="${escapeHtml(p.name)}" src="${escapeHtml(p.image)}"
               onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,${encodeURIComponent(svgFallback(p.name))}'">
        </div>
        <div class="body">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="meta">
            <div>
              <div class="price">${money(p.price)} DT</div>
              ${p.oldPrice ? `<div class="old">${money(p.oldPrice)} DT</div>` : ``}
            </div>
            <div style="color:var(--muted); font-size:12px; text-align:right;">
              ${p.code ? `Code: <b style="color:var(--txt)">${escapeHtml(p.code)}</b>` : ``}
            </div>
          </div>
          <button class="btn" ${disabled ? "disabled" : ""}>➕ Ajouter</button>
        </div>
      `;

      const addBtn = card.querySelector(".btn");
      addBtn.onclick = () => addToCart(p);

      grid.appendChild(card);
    });

    area.innerHTML = "";
    area.appendChild(grid);
  }

  function svgFallback(name){
    const t = (name || "Produit").slice(0, 18);
    return `<svg xmlns='http://www.w3.org/2000/svg' width='600' height='450'>
      <defs>
        <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
          <stop stop-color='#0fbf7c' offset='0'/>
          <stop stop-color='#00b3ff' offset='1'/>
        </linearGradient>
      </defs>
      <rect width='100%' height='100%' fill='url(#g)' opacity='.18'/>
      <rect x='18' y='18' width='564' height='414' rx='28' fill='rgba(255,255,255,.05)' stroke='rgba(255,255,255,.12)'/>
      <text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle'
        font-family='system-ui,Segoe UI,Arial' font-size='26' fill='rgba(232,240,245,.9)'>${t}</text>
    </svg>`;
  }

  /************************************************************
   * CART
   ************************************************************/
  function addToCart(p){
    const key = p.code || (p.categoryKey + "::" + p.name);
    const cur = state.cart[key];
    if(cur){
      cur.quantity += 1;
    } else {
      state.cart[key] = {
        key,
        code: p.code || "",
        name: p.name,
        price: p.price,
        oldPrice: p.oldPrice,
        isPromotion: p.isPromotion,
        image: p.image,
        stock: p.stock,
        quantity: 1
      };
    }
    saveState();
    updateCartUI();
    showToast("Ajouté au panier", p.name, "ok");
  }

  function updateCartUI(){
    const items = Object.values(state.cart);
    const count = items.reduce((a,it)=>a+it.quantity, 0);
    $("cartCount").textContent = String(count);

    // render list
    const list = $("cartList");
    list.innerHTML = "";
    if(!items.length){
      list.innerHTML = `<div class="center">Panier vide.</div>`;
    } else {
      items.forEach(it => {
        const el = document.createElement("div");
        el.className = "cartitem";
        el.innerHTML = `
          <div>
            <div class="t">${escapeHtml(it.name)}</div>
            <div style="color:var(--muted); font-size:12px;">
              ${it.code ? `Code: ${escapeHtml(it.code)} • ` : ``}
              PU: <b style="color:var(--txt)">${money(it.price)} DT</b>
            </div>
          </div>
          <div class="qty">
            <button aria-label="moins">−</button>
            <span>${it.quantity}</span>
            <button aria-label="plus">+</button>
          </div>
        `;
        const [bMinus, , bPlus] = el.querySelectorAll("button, span");
        bMinus.onclick = () => changeQty(it.key, -1);
        bPlus.onclick = () => changeQty(it.key, +1);
        list.appendChild(el);
      });
    }

    // totals
    const subtotal = items.reduce((s,it)=> s + it.price*it.quantity, 0);
    const shipping = subtotal >= CONFIG.freeShipping ? 0 : (items.length ? CONFIG.shippingFee : 0);
    const total = subtotal + shipping;

    $("subTotalTxt").textContent = money(subtotal);
    $("shipTxt").textContent = money(shipping);
    $("totalTxt").textContent = money(total);

    // enable order?
    $("placeOrderBtn").disabled = (subtotal < CONFIG.minOrder || items.length === 0);
  }

  function changeQty(key, delta){
    const it = state.cart[key];
    if(!it) return;
    it.quantity += delta;
    if(it.quantity <= 0) delete state.cart[key];
    saveState();
    updateCartUI();
  }

  function clearCart(){
    state.cart = {};
    saveState();
    updateCartUI();
    showToast("Panier vidé", "", "warn");
  }

  /************************************************************
   * ORDER TEXT + SEND TO GOOGLE SHEETS
   ************************************************************/
  function buildOrderText(orderData){
    const dt = new Date();
    const items = Object.values(state.cart);

    const lines = [];
    lines.push("NOUVELLE COMMANDE - MAXI JDC MARKET");
    lines.push(dt.toLocaleString("fr-FR"));
    lines.push("");
    lines.push("CLIENT:");
    lines.push(`- Nom: ${state.user.name || "(non renseigné)"}`);
    lines.push(`- Téléphone: ${state.user.phone || "(non renseigné)"}`);
    lines.push(`- Adresse: ${state.user.address || "(non renseigné)"}`);
    lines.push("");
    lines.push("ARTICLES:");
    items.forEach((it, idx) => {
      lines.push(`${idx+1}) ${it.name} ${it.code ? "["+it.code+"]" : ""} x${it.quantity} = ${money(it.price*it.quantity)} DT`);
    });
    lines.push("");
    lines.push(`Sous-total: ${money(orderData.subtotal)} DT`);
    lines.push(`Livraison: ${money(orderData.shipping)} DT`);
    lines.push(`TOTAL: ${money(orderData.total)} DT`);

    return lines.join("\n");
  }

  async function enregistrerCommandeAutomatique(orderData){
    // Envoi via JSONP vers ton Apps Script (action=submit)
    const payload = {
      token: "MAXI_JDC_2026",
      timestamp: new Date().toISOString(),
      commande_id: Date.now().toString(),

      client_nom: state.user.name || "",
      client_telephone: state.user.phone || "",
      client_adresse: state.user.address || "",

      gps_lat: state.user.lat ?? null,
      gps_lng: state.user.lng ?? null,

      articles: Object.values(state.cart).map(it => ({
        produit: it.name,
        code: it.code,
        quantite: it.quantity,
        prix_unitaire: it.price,
        prix_total: it.price * it.quantity,
        promotion: !!it.isPromotion,
        ancien_prix: it.oldPrice || it.price
      })),

      sous_total: orderData.subtotal,
      frais_livraison: orderData.shipping,
      total: orderData.total,
      economies: orderData.savings || 0,
      pourcentage_economies: orderData.savingsPercentage || 0
    };

    const url = CONFIG.commandeApiUrl
      + "?action=submit"
      + "&payload=" + encodeURIComponent(JSON.stringify(payload));

    try{
      const json = await fetchJsonp(url, { timeout: 12000 });
      console.log("Réponse GS:", json);
      return !!(json && (json.ok === true || json.success === true));
    }catch(e){
      console.error("Erreur enregistrement GS:", e);
      return false;
    }
  }

  async function placeOrder(){
    const items = Object.values(state.cart);
    if(!items.length){
      showToast("Panier vide", "Ajoute des produits avant de commander.", "warn");
      return;
    }

    // totals
    const subtotal = items.reduce((s,it)=> s + it.price*it.quantity, 0);
    const shipping = subtotal >= CONFIG.freeShipping ? 0 : CONFIG.shippingFee;
    const total = subtotal + shipping;

    if(subtotal < CONFIG.minOrder){
      showToast("Montant insuffisant", `Minimum: ${CONFIG.minOrder} DT`, "warn");
      return;
    }

    // demander infos client si vide (simple prompt)
    if(!state.user.name || !state.user.phone || !state.user.address){
      const n = prompt("Nom du client:", state.user.name || "");
      if(n === null) return;
      const p = prompt("Téléphone:", state.user.phone || "");
      if(p === null) return;
      const a = prompt("Adresse:", state.user.address || "");
      if(a === null) return;
      state.user.name = n.trim();
      state.user.phone = p.trim();
      state.user.address = a.trim();
      saveState();
    }

    const orderData = { subtotal, shipping, total };

    // texte commande
    const text = buildOrderText(orderData);
    state.lastOrderText = text;

    // Afficher modal
    $("orderDetails").textContent = text;
    $("orderModal").classList.add("open");

    // Enregistrer dans Google Sheets
    const ok = await enregistrerCommandeAutomatique(orderData);
    if(ok){
      showToast("✅ Commande enregistrée", "Google Sheets a confirmé l’enregistrement.", "ok");
      // si tu veux vider le panier après succès, décommente :
      // clearCart();
    }else{
      showToast("⚠️ Commande créée", "Erreur d'enregistrement automatique (GS).", "warn");
    }
  }

  function openWhatsApp(text){
    const msg = encodeURIComponent(text);
    const phone = CONFIG.whatsappNumber.replace(/\D/g, "");
    const url = `https://wa.me/${phone}?text=${msg}`;
    window.open(url, "_blank");
  }

  function downloadText(filename, text){
    const blob = new Blob([text], { type:"text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 0);
  }

  /************************************************************
   * UI EVENTS
   ************************************************************/
  function openCart(){ $("cartDrawer").classList.add("open"); document.body.style.overflow="hidden"; }
  function closeCart(){ $("cartDrawer").classList.remove("open"); document.body.style.overflow=""; }

  function init(){
    $("minOrderTxt").textContent = CONFIG.minOrder + " DT";
    $("freeShipTxt").textContent = CONFIG.freeShipping + " DT";
    $("shipFeeTxt").textContent = CONFIG.shippingFee + " DT";

    loadState();
    updateCartUI();

    $("cartBtn").onclick = openCart;
    $("closeCartBtn").onclick = closeCart;
    $("cartDrawer").addEventListener("click", (e)=>{ if(e.target === $("cartDrawer")) closeCart(); });

    $("clearCartBtn").onclick = clearCart;
    $("placeOrderBtn").onclick = placeOrder;

    $("closeOrderModalBtn").onclick = () => $("orderModal").classList.remove("open");
    $("orderModal").addEventListener("click", (e)=>{ if(e.target === $("orderModal")) $("orderModal").classList.remove("open"); });

    $("copyOrderBtn").onclick = async () => {
      try{
        await navigator.clipboard.writeText(state.lastOrderText || $("orderDetails").textContent || "");
        showToast("Copié", "Commande copiée dans le presse-papiers.", "ok");
      }catch(e){
        showToast("Erreur", "Impossible de copier.", "err");
      }
    };

    $("downloadOrderBtn").onclick = () => {
      const name = "commande_" + new Date().toISOString().slice(0,19).replace(/[:T]/g,"-") + ".txt";
      downloadText(name, state.lastOrderText || $("orderDetails").textContent || "");
    };

    $("whatsappOrderBtn").onclick = () => openWhatsApp(state.lastOrderText || $("orderDetails").textContent || "");

    $("searchInput").addEventListener("input", () => renderProducts());

    $("refreshBtn").onclick = async () => {
      showToast("Rafraîchissement", "Rechargement des produits…", "ok");
      await loadAllProducts();
    };

    loadAllProducts().then(() => showToast("👋 Bienvenue", "MAXI JDC MARKET est prêt.", "ok"));
  }

  document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
