<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MAXI – Commande en ligne</title>

  <style>
    :root {
      --main: #d40000;
      --dark: #222;
      --light: #fff;
      --gray: #f4f4f4;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--gray);
      color: var(--dark);
    }

    header {
      background: var(--light);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: var(--main);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-bar-top button {
      border: 1px solid #ccc;
      background: #fff;
      padding: 5px 8px;
      cursor: pointer;
      border-radius: 4px;
    }

    .lang-bar-top button:hover {
      background: #eee;
    }

    .promo-bar {
      background: #ffeaea;
      color: #900;
      padding: 6px 12px;
      font-size: 14px;
      text-align: center;
    }

    main {
      padding: 12px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 12px;
    }

    .category {
      background: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid #ddd;
    }

    .category.active {
      background: var(--main);
      color: #fff;
      border-color: var(--main);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    .product {
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      border: 1px solid #ddd;
    }

    .product h4 {
      margin: 6px 0;
      font-size: 15px;
    }

    .product button {
      width: 100%;
      background: var(--main);
      color: #fff;
      border: none;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .cart-btn {
      background: var(--main);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">MAXI</div>

  <div class="top-actions">
    <div class="lang-bar-top">
      <button onclick="setLang('fr')">FR</button>
      <button onclick="setLang('ar')">AR</button>
      <button onclick="setLang('en')">EN</button>
    </div>
    <div class="cart-btn" onclick="openCart()">🛒 Panier</div>
  </div>
</header>

<div class="promo-bar">
  🔥 Promotions du jour – Livraison rapide
</div>

<main>
  <div id="categories" class="categories"></div>
  <div id="products" class="products"></div>
</main>

<!-- =========================
     PANIER (MODAL)
========================= -->
<div id="cartModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:2000;">
  <div style="background:#fff; width:min(520px, 92vw); margin:50px auto; border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.25);">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid #eee;">
      <div style="font-weight:700;">🛒 Votre panier</div>
      <button onclick="closeCart()" style="border:none;background:#eee;border-radius:8px;padding:6px 10px;cursor:pointer;">✖</button>
    </div>

    <div style="padding:12px 14px; max-height:55vh; overflow:auto;">
      <div id="cartItems"></div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:10px; border-top:1px solid #eee;">
        <div style="font-weight:700;">Total</div>
        <div style="font-weight:800;" id="cartTotal">0.000 DT</div>
      </div>

      <div style="display:flex; gap:10px; margin-top:12px;">
        <button onclick="clearCart()"
          style="flex:1; border:1px solid #ddd; background:#fff; border-radius:10px; padding:10px; cursor:pointer;">
          Vider
        </button>
        <button onclick="openCheckout()"
          style="flex:2; border:none; background:var(--main); color:#fff; border-radius:10px; padding:10px; cursor:pointer; font-weight:700;">
          ✅ Commander
        </button>
      </div>
    </div>
  </div>
</div>

<!-- =========================
     CHECKOUT (MODAL)
========================= -->
<div id="checkoutModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:2100;">
  <div style="background:#fff; width:min(620px, 92vw); margin:30px auto; border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.25);">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid #eee;">
      <div style="font-weight:700;">🧾 Validation de commande</div>
      <button onclick="closeCheckout()" style="border:none;background:#eee;border-radius:8px;padding:6px 10px;cursor:pointer;">✖</button>
    </div>

    <div style="padding:12px 14px; max-height:70vh; overflow:auto;">
      <div style="background:#f7f7f7; padding:10px; border-radius:10px; border:1px solid #eee;">
        <div style="font-weight:700; margin-bottom:6px;">Résumé</div>
        <div id="checkoutSummary" style="white-space:pre-line; font-size:14px;"></div>
        <div style="display:flex; justify-content:space-between; margin-top:8px;">
          <div style="font-weight:700;">Total</div>
          <div style="font-weight:800;" id="checkoutTotal">0.000 DT</div>
        </div>
      </div>

      <div style="margin-top:12px; display:grid; gap:10px;">
        <input id="clientName" placeholder="Nom et prénom" style="padding:10px; border:1px solid #ddd; border-radius:10px;">
        <input id="clientPhone" placeholder="Téléphone" style="padding:10px; border:1px solid #ddd; border-radius:10px;">
        <input id="clientAddress" placeholder="Adresse" style="padding:10px; border:1px solid #ddd; border-radius:10px;">

        <select id="zone" style="padding:10px; border:1px solid #ddd; border-radius:10px;">
          <option value="">Zone (optionnel)</option>
          <option value="Zone 1">Zone 1</option>
          <option value="Zone 2">Zone 2</option>
          <option value="Zone 3">Zone 3</option>
        </select>

        <select id="paymentMethod" style="padding:10px; border:1px solid #ddd; border-radius:10px;">
          <option value="Cash">Paiement: Cash</option>
          <option value="Carte">Paiement: Carte</option>
        </select>

        <textarea id="note" placeholder="Note (optionnel)" rows="3"
          style="padding:10px; border:1px solid #ddd; border-radius:10px; resize:vertical;"></textarea>

        <button id="btnSendOrder"
          onclick="submitOrder()"
          style="border:none; background:var(--main); color:#fff; border-radius:12px; padding:12px; cursor:pointer; font-weight:800;">
          📩 Envoyer la commande
        </button>

        <div id="orderResult" style="display:none; padding:10px; border-radius:10px; background:#ecfff0; border:1px solid #bfe8c8; font-size:14px;"></div>
      </div>
    </div>
  </div>
</div>

<!-- =========================
     SCRIPT + DATA
========================= -->
<script>
  // ====== CONFIG ======
  // IMPORTANT: Mets ici l'URL de ton Apps Script Web App (/exec)
  const CONFIG = {
    commandeApiUrl: "PASTE_YOUR_APPS_SCRIPT_WEBAPP_EXEC_URL_HERE"
  };

  // ====== STATE ======
  const state = {
    lang: "fr",
    category: "Tout",
    cart: [],
    pendingOrder: null // snapshot panier au moment de la création
  };

  // ====== CATALOGUE (exemple) ======
  // Remplace/complète ici avec tes catégories + articles.
  const CATALOG = [
    { id: "boissons", label: {fr:"Boissons", ar:"مشروبات", en:"Drinks"}, items: [
      { name: {fr:"Eau 1.5L", ar:"ماء 1.5L", en:"Water 1.5L"}, price: 1.200 },
      { name: {fr:"Soda 1L", ar:"مشروب 1L", en:"Soda 1L"}, price: 2.300 }
    ]},
    { id: "epicerie", label: {fr:"Épicerie", ar:"بقالة", en:"Grocery"}, items: [
      { name: {fr:"Sucre 1kg", ar:"سكر 1كغ", en:"Sugar 1kg"}, price: 3.500 },
      { name: {fr:"Pâtes 500g", ar:"مكرونة 500غ", en:"Pasta 500g"}, price: 2.150 }
    ]},
    { id: "laitiers", label: {fr:"Laitiers", ar:"ألبان", en:"Dairy"}, items: [
      { name: {fr:"Lait 1L", ar:"حليب 1L", en:"Milk 1L"}, price: 2.000 },
      { name: {fr:"Yaourt", ar:"ياغورت", en:"Yogurt"}, price: 0.850 }
    ]}
  ];

  // ====== UTILS ======
  function t(obj) {
    // obj: {fr, ar, en}
    return (obj && obj[state.lang]) ? obj[state.lang] : (obj?.fr || "");
  }
  function money(x) {
    const n = Number(x || 0);
    return n.toFixed(3) + " DT";
  }

  // ====== LANG ======
  function setLang(l) {
    state.lang = l;
    renderCategories();
    renderProducts();
    renderCart();
  }

  // ====== RENDER CATEGORIES ======
  function renderCategories() {
    const el = document.getElementById("categories");
    const cats = [{ id:"Tout", label:{fr:"Tout", ar:"الكل", en:"All"} }, ...CATALOG.map(c => ({id:c.id, label:c.label}))];

    el.innerHTML = cats.map(c => {
      const active = (state.category === c.id) ? "active" : "";
      return `<div class="category ${active}" onclick="selectCategory('${c.id}')">${t(c.label)}</div>`;
    }).join("");
  }

  function selectCategory(id) {
    state.category = id;
    renderCategories();
    renderProducts();
  }

  // ====== RENDER PRODUCTS ======
  function renderProducts() {
    const el = document.getElementById("products");

    let items = [];
    if (state.category === "Tout") {
      CATALOG.forEach(cat => {
        cat.items.forEach(it => items.push({ catId: cat.id, ...it }));
      });
    } else {
      const cat = CATALOG.find(c => c.id === state.category);
      items = cat ? cat.items.map(it => ({ catId: cat.id, ...it })) : [];
    }

    el.innerHTML = items.map((it, idx) => {
      const name = t(it.name);
      return `
        <div class="product">
          <h4>${name}</h4>
          <div style="font-weight:700; margin:6px 0;">${money(it.price)}</div>
          <button onclick="addToCart('${escapeHtml(name)}', ${Number(it.price)})">Ajouter</button>
        </div>
      `;
    }).join("");
  }

  function escapeHtml(s) {
    return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  // ====== CART ======
  function addToCart(name, price) {
    const idx = state.cart.findIndex(x => x.name === name);
    if (idx >= 0) state.cart[idx].quantity += 1;
    else state.cart.push({ name, price: Number(price), quantity: 1 });
    renderCart();
  }

  function removeFromCart(name) {
    state.cart = state.cart.filter(x => x.name !== name);
    renderCart();
  }

  function changeQty(name, delta) {
    const item = state.cart.find(x => x.name === name);
    if (!item) return;
    item.quantity += delta;
    if (item.quantity <= 0) removeFromCart(name);
    renderCart();
  }

  function clearCart() {
    state.cart = [];
    renderCart();
  }

  function cartTotal() {
    return state.cart.reduce((s, it) => s + (Number(it.price) * Number(it.quantity)), 0);
  }

  function renderCart() {
    const itemsEl = document.getElementById("cartItems");
    const totalEl = document.getElementById("cartTotal");

    if (!itemsEl || !totalEl) return;

    if (state.cart.length === 0) {
      itemsEl.innerHTML = `<div style="padding:10px; background:#fafafa; border:1px dashed #ddd; border-radius:10px;">Panier vide.</div>`;
    } else {
      itemsEl.innerHTML = state.cart.map(it => `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid #f0f0f0;">
          <div style="flex:1;">
            <div style="font-weight:700;">${escapeHtml(it.name)}</div>
            <div style="font-size:13px; color:#555;">${money(it.price)} / unité</div>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button onclick="changeQty('${escapeHtml(it.name)}', -1)" style="border:1px solid #ddd; background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer;">-</button>
            <div style="min-width:26px; text-align:center; font-weight:800;">${it.quantity}</div>
            <button onclick="changeQty('${escapeHtml(it.name)}', 1)" style="border:1px solid #ddd; background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer;">+</button>
          </div>
          <div style="min-width:95px; text-align:right; font-weight:800;">${money(it.price * it.quantity)}</div>
          <button onclick="removeFromCart('${escapeHtml(it.name)}')" title="Supprimer"
            style="border:none;background:#ffecec;color:#a00;border-radius:10px;padding:6px 10px;cursor:pointer;">🗑</button>
        </div>
      `).join("");
    }

    totalEl.textContent = money(cartTotal());
    // si checkout ouvert => update résumé
    if (document.getElementById("checkoutModal")?.style.display === "block") {
      fillCheckoutSummary();
    }
  }

  // ====== MODALS ======
  function openCart() {
    document.getElementById("cartModal").style.display = "block";
    renderCart();
  }
  function closeCart() {
    document.getElementById("cartModal").style.display = "none";
  }
  function openCheckout() {
    if (state.cart.length === 0) {
      alert("Votre panier est vide.");
      return;
    }
    // snapshot panier (IMPORTANT)
    state.pendingOrder = snapshotCartForOrder();
    document.getElementById("checkoutModal").style.display = "block";
    fillCheckoutSummary();
  }
  function closeCheckout() {
    document.getElementById("checkoutModal").style.display = "none";
  }

  function snapshotCartForOrder() {
    const items = state.cart.map(it => ({
      name: it.name,
      qty: it.quantity,
      price: it.price,
      total: (Number(it.quantity) * Number(it.price))
    }));
    const total = items.reduce((s, it) => s + Number(it.total || 0), 0);
    return { items, total };
  }

  function fillCheckoutSummary() {
    const box = document.getElementById("checkoutSummary");
    const totalEl = document.getElementById("checkoutTotal");
    const snap = state.pendingOrder || snapshotCartForOrder();

    box.textContent = snap.items.map(it => `- ${it.name} x${it.qty} = ${money(it.total)}`).join("\n");
    totalEl.textContent = money(snap.total);
  }

  // init
  renderCategories();
  renderProducts();
  renderCart();
</script>

<script>
  // =========================
  //  ENVOI COMMANDE (SHEET + WHATSAPP)
  // =========================

  function setLoading(isLoading) {
    const btn = document.getElementById("btnSendOrder");
    if (!btn) return;
    btn.disabled = !!isLoading;
    btn.style.opacity = isLoading ? "0.7" : "1";
    btn.textContent = isLoading ? "⏳ Envoi en cours..." : "📩 Envoyer la commande";
  }

  function showResult(html, isError=false) {
    const box = document.getElementById("orderResult");
    if (!box) return;
    box.style.display = "block";
    box.style.background = isError ? "#fff0f0" : "#ecfff0";
    box.style.border = isError ? "1px solid #f0b4b4" : "1px solid #bfe8c8";
    box.style.color = isError ? "#900" : "#135d2d";
    box.innerHTML = html;
  }

  function validateCheckoutForm() {
    const name = document.getElementById("clientName")?.value?.trim();
    const phone = document.getElementById("clientPhone")?.value?.trim();
    const address = document.getElementById("clientAddress")?.value?.trim();

    if (!name) return { ok:false, error:"Veuillez saisir votre nom." };
    if (!phone) return { ok:false, error:"Veuillez saisir votre téléphone." };
    if (!address) return { ok:false, error:"Veuillez saisir votre adresse." };

    return { ok:true };
  }

  async function submitOrder() {
    try {
      const v = validateCheckoutForm();
      if (!v.ok) {
        alert(v.error);
        return;
      }

      if (!CONFIG.commandeApiUrl || CONFIG.commandeApiUrl.includes("PASTE_YOUR_APPS_SCRIPT_WEBAPP_EXEC_URL_HERE")) {
        alert("⚠️ Configure d'abord CONFIG.commandeApiUrl (URL /exec de ton Apps Script).");
        return;
      }

      if (!state.pendingOrder || !state.pendingOrder.items || state.pendingOrder.items.length === 0) {
        // sécurité: si pendingOrder absent, on recalcule
        state.pendingOrder = snapshotCartForOrder();
      }

      setLoading(true);
      showResult("Envoi...", false);

      const payload = buildOrderPayloadFromUI();
      const api = await createOrderOnServer(payload);

      // api renvoie { ok:true, commande_id, whatsapp_url }
      const commandeId = api.commande_id;
      const whatsappUrl = api.whatsapp_url;

      // Son tablette 5 fois (nouvelle commande)
      playOrderNotificationSound(5);

      // Afficher le résultat
      showResult(
        `✅ Commande enregistrée.<br><b>ID:</b> ${escapeHtml(commandeId)}<br>
         <button onclick="openWhatsApp('${encodeURIComponent(whatsappUrl)}')"
           style="margin-top:8px;border:none;background:#25D366;color:#fff;border-radius:10px;padding:10px;cursor:pointer;font-weight:800;">
           Ouvrir WhatsApp (message prêt)
         </button>`,
        false
      );

      // IMPORTANT: vider panier seulement après succès (le snapshot a déjà été envoyé)
      state.cart = [];
      state.pendingOrder = null;
      renderCart();

      // Auto-ouvrir WhatsApp (si le navigateur l'autorise)
      setTimeout(() => {
        try { window.open(whatsappUrl, "_blank"); } catch(e) {}
      }, 350);

    } catch (err) {
      console.error(err);
      showResult("❌ Erreur: " + escapeHtml(String(err?.message || err)), true);
      alert("Erreur lors de l'envoi. Vérifie l'URL Apps Script et réessaie.");
    } finally {
      setLoading(false);
    }
  }

  function buildOrderPayloadFromUI() {
    const snap = state.pendingOrder || snapshotCartForOrder();

    const name = document.getElementById("clientName").value.trim();
    const phone = document.getElementById("clientPhone").value.trim();
    const address = document.getElementById("clientAddress").value.trim();
    const zone = document.getElementById("zone").value.trim();
    const payment = document.getElementById("paymentMethod").value.trim();
    const note = document.getElementById("note").value.trim();

    return {
      lang: state.lang,
      client_name: name,
      client_phone: phone,
      client_address: address,
      zone: zone,
      payment_method: payment,
      note: note,
      cart_items: snap.items.map(it => ({
        name: it.name,
        qty: it.qty,
        price: it.price,
        total: it.total
      })),
      total: snap.total
    };
  }

  async function createOrderOnServer(payload) {
    const url = `${CONFIG.commandeApiUrl}?method=createOrder`;
    const res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Erreur API createOrder");
    return data;
  }

  function openWhatsApp(encodedUrl) {
    try {
      const url = decodeURIComponent(encodedUrl);
      window.open(url, "_blank");
    } catch (e) {
      alert("Impossible d'ouvrir WhatsApp automatiquement.");
    }
  }

  // =========================
  //  SON (5 FOIS)
  // =========================
  function playOrderNotificationSound(times = 5) {
    let count = 0;

    const beepOnce = () => {
      const ACtx = window.AudioContext || window.webkitAudioContext;
      if (!ACtx) return;

      const ctx = new ACtx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();

      o.type = "sine";
      o.frequency.value = 880;     // fréquence beep
      g.gain.value = 0.08;

      o.connect(g);
      g.connect(ctx.destination);

      o.start();
      setTimeout(() => {
        try { o.stop(); } catch(e) {}
        try { ctx.close(); } catch(e) {}
      }, 160);
    };

    const interval = setInterval(() => {
      beepOnce();
      count++;
      if (count >= times) clearInterval(interval);
    }, 380);
  }

  // Fermer modals si clic dehors
  document.getElementById("cartModal")?.addEventListener("click", (e) => {
    if (e.target.id === "cartModal") closeCart();
  });
  document.getElementById("checkoutModal")?.addEventListener("click", (e) => {
    if (e.target.id === "checkoutModal") closeCheckout();
  });

</script>

<script>
  // =========================
  //  PETITS PLUS / SÉCURITÉ
  // =========================

  // Empêche l'envoi si panier vide (au cas où)
  function guardEmptyCart() {
    if (!state.cart || state.cart.length === 0) {
      alert("Panier vide.");
      return false;
    }
    return true;
  }

  // Ajuster texte du bouton panier selon langue (optionnel)
  function updateCartButtonLabel() {
    const btns = document.getElementsByClassName("cart-btn");
    if (!btns || !btns.length) return;
    const label = (state.lang === "ar") ? "🛒 السلة"
                : (state.lang === "en") ? "🛒 Cart"
                : "🛒 Panier";
    btns[0].textContent = label;
  }

  // Hook sur setLang pour mettre à jour bouton panier
  const _setLang = setLang;
  setLang = function(l) {
    _setLang(l);
    updateCartButtonLabel();
  };

  // Première mise à jour
  updateCartButtonLabel();

  // Debug: ping api (optionnel)
  async function pingApi() {
    try {
      if (!CONFIG.commandeApiUrl || CONFIG.commandeApiUrl.includes("PASTE_YOUR_APPS_SCRIPT_WEBAPP_EXEC_URL_HERE")) return;
      const res = await fetch(`${CONFIG.commandeApiUrl}?method=ping`);
      const data = await res.json();
      console.log("API ping:", data);
    } catch(e) {
      console.log("API ping error:", e);
    }
  }
  pingApi();
</script>

<footer style="text-align:center; padding:18px 10px; color:#666; font-size:13px;">
  © MAXI — Commande en ligne
</footer>

</body>
</html>
