<html lang="fr">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MAXI JDC MARKET" />
  <meta name="theme-color" content="#0a1929" />
  <title>MAXI JDC MARKET --- Application Mobile</title>
  
  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <style>
    /* [Tous les styles CSS précédents restent inchangés] */
    /* Pour gagner de l'espace, je garde uniquement les styles essentiels */
    
    :root {
      --bg0: #0a1929;
      --bg1: #112240;
      --card: #1a365d;
      --card2: #162447;
      --line: rgba(255, 255, 255, .15);
      --text: #f0f6fc;
      --muted: #8b949e;
      --accent: #00ff88;
      --accent2: #00d4ff;
      --danger: #ff6b6b;
      --warning: #ffa726;
      --shadow: 0 10px 40px rgba(0, 0, 0, .5);
      --radius: 12px;
      --drawerW: 100vw;
      --header-height: 60px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoi UI', Roboto, Oxygen, Ubuntu, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg0) 0%, var(--bg1) 100%);
      line-height: 1.6;
      overflow-x: hidden;
      touch-action: manipulation;
      height: 100vh;
      height: -webkit-fill-available;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .wrap {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 8px 70px;
      transition: transform .3s ease;
      height: 100%;
    }

    /* BARRE DE LANGUE EN HAUT */
    .lang-top-bar {
      background: rgba(0, 0, 0, 0.9);
      border-bottom: 1px solid var(--accent2);
      padding: 8px 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1001;
    }

    .lang-top-bar .lang-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 2px solid var(--accent2);
      background: rgba(0, 212, 255, 0.15);
      color: var(--text);
      cursor: pointer;
      font-weight: 900;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0, 212, 255, 0.2);
    }

    .lang-top-bar .lang-btn.active {
      background: var(--accent2);
      border-color: var(--accent);
      color: var(--bg0);
      transform: scale(1.1);
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
    }

    /* HEADER */
    .header {
      background: rgba(10, 25, 47, 0.98);
      border-bottom: 1px solid var(--line);
      padding: 8px 12px;
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(20px);
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .logo-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 2px solid var(--accent);
      overflow: hidden;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: #0a1929;
      padding: 2px;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 900;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .brand-text p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 10px;
    }

    /* BOUTON PANIER */
    .cart-btn-header {
      position: relative;
      width: 50px;
      height: 44px;
      border-radius: 10px;
      border: 2px solid var(--accent);
      background: rgba(0, 255, 136, 0.1);
      color: var(--accent);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .cart-btn-header .count {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--accent);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      position: absolute;
      top: -5px;
      right: -5px;
    }

    /* RECHERCHE */
    .search-section {
      padding: 8px 8px 0;
      background: var(--bg0);
      position: sticky;
      top: var(--header-height);
      z-index: 990;
    }

    .search-container {
      display: flex;
      gap: 6px;
      align-items: center;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 6px;
      box-shadow: var(--shadow);
    }

    .search-input {
      flex: 1;
      min-width: 0;
      position: relative;
    }

    .search-input input {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .08);
      color: var(--text);
      padding: 0 12px;
      outline: none;
      font-size: 14px;
      transition: all 0.2s ease;
      padding-right: 44px;
    }

    .search-buttons {
      display: flex;
      gap: 4px;
    }

    .search-btn {
      height: 40px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .1);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .search-btn.green {
      background: rgba(0, 255, 136, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* CATÉGORIES */
    .categories-scroll {
      margin-top: 8px;
      padding: 6px 6px 2px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      position: sticky;
      top: calc(var(--header-height) + 70px);
      z-index: 980;
      background: var(--bg0);
      height: 38px;
    }

    .cat-scroll-container {
      display: flex;
      gap: 4px;
      min-width: max-content;
      align-items: center;
      height: 30px;
    }

    .cat-btn {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .05);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 3px;
      min-height: 28px;
    }

    .cat-btn.active {
      border-color: var(--accent);
      background: rgba(0, 255, 136, 0.15);
      color: var(--accent);
    }

    .cat-btn.promo {
      background: linear-gradient(135deg, #ff0000, #ff6b00);
      color: #ffffff;
      border-color: #ff9900;
      font-weight: 900;
      animation: pulse 2s infinite;
    }

    .cat-count {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .3);
      border: 1px solid rgba(255, 255, 255, .1);
    }

    /* CONTENU PRINCIPAL */
    .main-content {
      padding: 8px;
    }

    .content-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 6px;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      margin-bottom: 10px;
    }

    .content-header h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 900;
      color: var(--accent);
    }

    /* GRID PRODUITS */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 8px 0 20px;
    }

    @media (min-width: 480px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 768px) {
      .products-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* CARTE PRODUIT */
    .product-card {
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card2);
      padding: 6px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .2);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 5px;
      height: 100%;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .product-card:hover {
      border-color: var(--accent2);
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(0, 212, 255, 0.15);
    }

    .product-image {
      width: 100%;
      height: 110px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: linear-gradient(135deg, #1a365d 0%, #112240 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 5px;
    }

    .product-image img {
      max-width: 90%;
      max-height: 90%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .no-photo {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-weight: 800;
      font-size: 10px;
      background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
      text-align: center;
      padding: 15px;
    }

    .product-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
    }

    .product-name {
      font-weight: 900;
      font-size: 11px;
      line-height: 1.3;
      min-width: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text);
    }

    .product-price {
      font-weight: 900;
      padding: 4px 6px;
      border-radius: 999px;
      border: 2px solid var(--accent);
      background: rgba(0, 255, 136, 0.1);
      color: var(--accent);
      font-size: 11px;
      white-space: nowrap;
      text-align: center;
      width: 100%;
      margin-top: auto;
    }

    .product-stock-tag {
      padding: 2px 5px;
      border-radius: 999px;
      font-size: 8px;
      border: 1px solid rgba(255, 255, 255, .1);
      background: rgba(0, 0, 0, .2);
      color: rgba(255, 255, 255, .9);
      font-weight: 700;
      text-align: center;
      align-self: flex-start;
      margin-top: 2px;
    }

    .product-stock-tag.ok {
      border-color: rgba(0, 255, 136, .3);
      color: var(--accent);
      background: rgba(0, 255, 136, .08);
    }

    .product-stock-tag.low {
      border-color: rgba(255, 167, 38, .3);
      color: var(--warning);
      background: rgba(255, 167, 38, .08);
    }

    .product-stock-tag.out {
      border-color: rgba(255, 107, 107, .3);
      color: var(--danger);
      background: rgba(255, 107, 107, .08);
    }

    /* BOUTON QR */
    .qr-direct-btn {
      position: fixed;
      bottom: 90px;
      right: 15px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(0, 212, 255, 0.2);
      border: 2px solid var(--accent2);
      color: var(--accent2);
      cursor: pointer;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
      transition: all 0.3s ease;
    }

    /* BOUTON ADMIN */
    .secret-admin-btn {
      position: fixed;
      bottom: 160px;
      right: 15px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 167, 38, 0.2);
      border: 2px solid var(--warning);
      color: var(--warning);
      cursor: pointer;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      box-shadow: 0 4px 15px rgba(255, 167, 38, 0.3);
      transition: all 0.3s ease;
    }

    /* ANIMATIONS */
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 5px 25px rgba(255, 107, 0, 0.3);
      }
      50% {
        transform: scale(1.02);
        box-shadow: 0 8px 30px rgba(255, 107, 0, 0.5);
      }
    }

    /* RESPONSIVE */
    @media (max-width: 480px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      
      .lang-top-bar .lang-btn {
        width: 36px;
        height: 36px;
        font-size: 12px;
      }
    }

    /* MASQUER LA BARRE DE DÉFILEMENT */
    .categories-scroll::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

      { code: "CONS001", name: "Thon à l'Huile", price: 4.5, category: "🥫 Conserves & Bocaux", categoryKey: "conserves", stock: 30 },
      { code: "CONS002", name: "Haricots Verts", price: 3.2, category: "🥫 Conserves & Bocaux", categoryKey: "conserves", stock: 25 },
      { code: "CONS003", name: "Confiture Fraise", price: 5.0, category: "🥫 Conserves & Bocaux", categoryKey: "conserves", stock: 20 },
      { code: "CONS004", name: "Maïs en Boîte", price: 2.8, category: "🥫 Conserves & Bocaux", categoryKey: "conserves", stock: 35 },
      
      // Cuisine du Monde
      { code: "CUIS001", name: "Pâtes Italiennes", price: 3.8, category: "🌍 Cuisine du Monde", categoryKey: "cuisine_monde", stock: 40 },
      { code: "CUIS002", name: "Sauce Tomate", price: 2.5, category: "🌍 Cuisine du Monde", categoryKey: "cuisine_monde", stock: 30 },
      { code: "CUIS003", name: "Riz Basmati", price: 6.0, category: "🌍 Cuisine du Monde", categoryKey: "cuisine_monde", stock: 25 },
      { code: "CUIS004", name: "Curry Indien", price: 4.2, category: "🌍 Cuisine du Monde", categoryKey: "cuisine_monde", stock: 15 },
      
      // Eaux & Boissons
      { code: "EAUX001", name: "Eau Minérale 1.5L", price: 1.0, category: "💧 Eaux & Boissons", categoryKey: "eaux", stock: 100 },
      { code: "EAUX002", name: "Soda Citron", price: 1.8, category: "💧 Eaux & Boissons", categoryKey: "eaux", stock: 60 },
      { code: "EAUX003", name: "Jus d'Orange", price: 3.5, category: "💧 Eaux & Boissons", categoryKey: "eaux", stock: 40 },
      { code: "EAUX004", name: "Boisson Énergisante", price: 2.2, category: "💧 Eaux & Boissons", categoryKey: "eaux", stock: 45 }
    ];

    // Catégories
    const CATEGORIES = [
      { key: "all", label: "🌐 Tous les produits", isAll: true },
      { key: "promotions", label: "🔥 PROMOTIONS", isPromo: true },
      { key: "cafe", label: "☕ Café & Thés" },
      { key: "animaux_compagnie", label: "🐶 Animaux de Compagnie" },
      { key: "bebe_maman", label: "👶 Bébé & Maman" },
      { key: "boulangerie_patisserie", label: "🥖 Boulangerie & Pâtisserie" },
      { key: "chips_snacks", label: "🥔 Chips & Snacks" },
      { key: "chocolats_biscuits", label: "🍫 Chocolats & Biscuits" },
      { key: "conserves", label: "🥫 Conserves & Bocaux" },
      { key: "cuisine_monde", label: "🌍 Cuisine du Monde" },
      { key: "eaux", label: "💧 Eaux & Boissons" }
    ];

    // ===================== TRADUCTIONS =====================
    const TRANSLATIONS = {
      fr: {
        appTitle: "MAXI JDC MARKET",
        appSubtitle: "Des prix mini --- Un MAXI choix",
        searchPlaceholder: "🔍 Rechercher un produit...",
        searchClear: "Effacer",
        searchAll: "Tous",
        productsTitle: "Produits",
        selectCategory: "Sélectionnez une catégorie",
        items: "article(s)",
        noProductsFound: "Aucun produit trouvé",
        toastAdded: "ajouté au panier !"
      },
      en: {
        appTitle: "MAXI JDC MARKET",
        appSubtitle: "Mini prices --- MAXI choice",
        searchPlaceholder: "🔍 Search a product...",
        searchClear: "Clear",
        searchAll: "All",
        productsTitle: "Products",
        selectCategory: "Select a category",
        items: "item(s)",
        noProductsFound: "No products found",
        toastAdded: "added to cart!"
      },
      ar: {
        appTitle: "ماكسي جي دي سي ماركت",
        appSubtitle: "أسعار مصغرة --- اختيار ماكسي",
        searchPlaceholder: "🔍 ابحث عن منتج...",
        searchClear: "مسح",
        searchAll: "الكل",
        productsTitle: "المنتجات",
        selectCategory: "اختر فئة",
        items: "منتج(ات)",
        noProductsFound: "لم يتم العثور على منتجات",
        toastAdded: "تمت الإضافة إلى السلة!"
      }
    };

    // ===================== ÉTAT GLOBAL =====================
    const state = {
      user: null,
      products: TEST_PRODUCTS,
      cart: {},
      searchQuery: '',
      activeCategory: 'all',
      showAllCategories: true,
      currentLanguage: 'fr',
      isAdmin: false
    };

    // ===================== UTILITAIRES =====================
    function $(id) { return document.getElementById(id); }

    function formatPrice(amount) {
      return Number(amount).toFixed(2).replace('.', ',') + ' dt';
    }

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <span>${type === 'success' ? '✅' : type === 'warning' ? '⚠️' : '❌'}</span>
        <span>${message}</span>
      `;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    function getStockStatus(stock) {
      if (stock <= 0) {
        return { class: 'out', text: 'Rupture de stock', available: false };
      } else if (stock <= 5) {
        return { class: 'low', text: `${stock} en stock`, available: true };
      } else {
        return { class: 'ok', text: 'En stock', available: true };
      }
    }

    // ===================== TRADUCTION =====================
    function setLanguage(lang) {
      if (!TRANSLATIONS[lang]) return;
      state.currentLanguage = lang;
      
      const t = TRANSLATIONS[lang];
      
      $('appTitle').textContent = t.appTitle;
      $('appSubtitle').textContent = t.appSubtitle;
      $('searchInput').placeholder = t.searchPlaceholder;
      $('clearSearchBtn').textContent = t.searchClear;
      $('showAllBtn').textContent = t.searchAll;
      $('activeCategoryLabel').textContent = t.productsTitle;
      $('activeCategoryMeta').textContent = t.selectCategory;
      
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      $(`langTop${lang.charAt(0).toUpperCase() + lang.slice(1)}Btn`).classList.add('active');
      
      localStorage.setItem('maxi_jdc_language', lang);
      updateItemCount();
    }

    function updateItemCount() {
      const t = TRANSLATIONS[state.currentLanguage];
      const filteredProducts = getFilteredProducts();
      $('itemCount').textContent = `${filteredProducts.length} ${t.items}`;
    }

    // ===================== AFFICHAGE =====================
    function renderCategories() {
      const container = $('categoriesContainer');
      container.innerHTML = '';
      
      CATEGORIES.forEach(category => {
        const products = state.products.filter(p => 
          category.key === 'all' ? true : p.categoryKey === category.key
        );
        
        const button = document.createElement('button');
        button.className = `cat-btn ${category.isPromo ? 'promo' : ''} ${
          state.activeCategory === category.key ? 'active' : ''
        }`;
        button.innerHTML = `${category.label} <span class="cat-count">${products.length}</span>`;
        button.onclick = () => {
          state.activeCategory = category.key;
          state.showAllCategories = category.key === 'all';
          renderCategories();
          renderProducts();
        };
        container.appendChild(button);
      });
    }

    function getFilteredProducts() {
      let products = state.products;
      
      // Filtrer par catégorie
      if (state.activeCategory !== 'all') {
        products = products.filter(p => p.categoryKey === state.activeCategory);
      }
      
      // Filtrer par recherche
      if (state.searchQuery) {
        const query = state.searchQuery.toLowerCase();
        products = products.filter(p =>
          p.name.toLowerCase().includes(query) ||
          p.code.toLowerCase().includes(query) ||
          p.category.toLowerCase().includes(query)
        );
      }
      
      return products;
    }

    function renderProducts() {
      const filteredProducts = getFilteredProducts();
      const grid = $('productsGrid');
      grid.innerHTML = '';
      
      if (filteredProducts.length === 0) {
        const t = TRANSLATIONS[state.currentLanguage];
        grid.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--muted);">
            <div style="font-size:42px;margin-bottom:12px;">🔍</div>
            <h3 style="margin-bottom:8px;color:var(--text);">${t.noProductsFound}</h3>
            <p style="font-size:12px;">Essayez de modifier votre recherche ou sélectionnez une autre catégorie</p>
          </div>
        `;
        updateItemCount();
        return;
      }
      
      filteredProducts.forEach(product => {
        const imgSrc = `${CONFIG.imagesBasePath}${product.code}.jpg`;
        const stockStatus = getStockStatus(product.stock);
        const card = document.createElement('div');
        card.className = `product-card ${product.isPromotion ? 'promo-card' : ''}`;
        
        // Badge promo
        let discountBadge = '';
        if (product.isPromotion && product.discountPercent > 0) {
          discountBadge = `<div class="product-discount">-${product.discountPercent}%</div>`;
        }
        
        // Prix avec ancien prix si promotion
        let priceDisplay = '';
        if (product.isPromotion && product.oldPrice && product.oldPrice > product.price) {
          priceDisplay = `
            <div style="font-size:8px;color:#ff8888;text-decoration:line-through;margin-bottom:2px;">
              ${formatPrice(product.oldPrice)}
            </div>
            <div class="product-price" style="background:rgba(255,153,0,0.15);border-color:#ff9900;color:#ffcc00;">
              ${formatPrice(product.price)}
            </div>
          `;
        } else {
          priceDisplay = `<div class="product-price">${formatPrice(product.price)}</div>`;
        }
        
        card.innerHTML = `
          <div class="product-image">
            <img src="${imgSrc}"
              alt="${product.name}"
              loading="lazy"
              onload="this.style.display='block'; this.nextElementSibling.style.display='none';"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="no-photo">${product.code}</div>
            ${discountBadge}
            ${product.isPromotion ? '<div class="image-promo-badge">PROMO</div>' : ''}
          </div>
          <div class="product-info">
            <div class="product-name">${product.name}</div>
            <div style="color:var(--muted);font-size:8px;">
              <div>Code: ${product.code}</div>
              <div>${product.category}</div>
            </div>
            ${priceDisplay}
          </div>
          <div class="product-stock-tag ${stockStatus.class}">
            ${stockStatus.class === 'ok' ? '✓' : stockStatus.class === 'low' ? '⚠️' : '✗'} ${stockStatus.text}
          </div>
        `;
        
        card.addEventListener('click', () => {
          if (stockStatus.available) {
            addToCart(product);
          } else {
            showToast('❌ Ce produit est en rupture de stock', 'error');
          }
        });
        
        grid.appendChild(card);
      });
      
      updateItemCount();
    }

    // ===================== GESTION PANIER =====================
    function addToCart(product) {
      const productId = `${product.categoryKey}_${product.code}`;
      
      if (!state.cart[productId]) {
        state.cart[productId] = {
          ...product,
          quantity: 0
        };
      }
      
      if (state.cart[productId].quantity < product.stock) {
        state.cart[productId].quantity++;
        updateCartUI();
        
        const t = TRANSLATIONS[state.currentLanguage];
        showToast(`${product.name} ${t.toastAdded}`);
      } else {
        showToast('❌ Stock insuffisant', 'error');
      }
    }

    function updateCartUI() {
      const cartCount = Object.values(state.cart).reduce((sum, item) => sum + item.quantity, 0);
      $('cartTopCount').textContent = cartCount;
      saveState();
    }

    // ===================== GESTION DES DONNÉES =====================
    function saveState() {
      const data = {
        user: state.user,
        cart: state.cart,
        version: '1.0'
      };
      localStorage.setItem(CONFIG.localStorageKey, JSON.stringify(data));
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(CONFIG.localStorageKey);
        if (saved) {
          const data = JSON.parse(saved);
          state.user = data.user || null;
          state.cart = data.cart || {};
          updateCartUI();
        }
      } catch (e) {
        console.warn('Erreur chargement état:', e);
      }
    }

    // ===================== ADMIN =====================
    function toggleAdminMode() {
      const password = prompt("Entrez le mot de passe administrateur:");
      if (password === CONFIG.adminPassword) {
        state.isAdmin = !state.isAdmin;
        alert(`Mode admin ${state.isAdmin ? 'activé' : 'désactivé'}`);
      } else if (password !== null) {
        alert("Mot de passe incorrect");
      }
    }

    // ===================== INITIALISATION =====================
    function init() {
      // Charger l'état sauvegardé
      loadState();
      
      // Charger la langue
      const savedLang = localStorage.getItem('maxi_jdc_language') || 'fr';
      setLanguage(savedLang);
      
      // Événements
      $('cartTopBtn').onclick = () => {
        alert('Fonctionnalité panier à implémenter');
      };

      $('searchInput').addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        renderProducts();
      });

      $('clearSearchBtn').onclick = () => {
        $('searchInput').value = '';
        state.searchQuery = '';
        renderProducts();
        $('searchInput').focus();
      };

      $('showAllBtn').onclick = () => {
        state.activeCategory = 'all';
        state.showAllCategories = true;
        renderCategories();
        renderProducts();
      };

      // Langue
      $('langTopFrBtn').onclick = () => setLanguage('fr');
      $('langTopEnBtn').onclick = () => setLanguage('en');
      $('langTopArBtn').onclick = () => setLanguage('ar');

      // Admin
      $('secretAdminBtn').onclick = toggleAdminMode;

      // QR Code
      $('qrDirectBtn').onclick = () => {
        alert('Fonctionnalité QR Code à implémenter');
      };

      // Initialiser l'affichage
      renderCategories();
      renderProducts();
      
      showToast('👋 Bienvenue sur MAXI JDC MARKET !');
    }

    // Démarrer l'application
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
